<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barossa 운영 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --page:#f6f7fb; --card:#ffffff; --surface:#eef0f6; --border:#e1e4ee; --grid:#e8eaf2; --axis:#c4c9d8;
  --text:#161a2b; --text2:#4a5068; --muted:#7c829a;
  --brand:#3a4bd8; --brand-soft:#e6e9fd;
  --feedgas:#5b4fc4; --lng:#2a78d6; --cond:#d4581f; --brent:#0f8b8c; --jkm:#b1348a;
  --late:#c62f2f; --late-bg:#fde8e8; --d7:#9a6200; --d7-bg:#fff2d6; --d30:#1d5fb8; --d30-bg:#e3eefc;
  --done:#1d7a3a; --done-bg:#e2f4e7; --plan:#4a5068; --plan-bg:#eef0f6; --rule:#6b4fa8; --rule-bg:#efeafa;
  --series:#2a78d6; --context:#9a9db0; --santos:#1baf7a; --sk:#2a78d6; --jera:#eb6834; --other:#8a90a6;
  --m-late:#d03b3b; --m-d7:#fab219; --m-d30:#5a86cf; --m-plan:#a3a8ba; --m-done:#0ca30c; --m-miss:#898781; --miss:#55586a; --miss-bg:#ececef;
  --shadow:0 1px 2px rgba(20,24,50,.05), 0 4px 16px -8px rgba(20,24,50,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f1220; --card:#181c2e; --surface:#20253a; --border:#2b3150; --grid:#262b44; --axis:#3d4466;
    --text:#eef0f8; --text2:#b9bfd6; --muted:#868ca8;
    --brand:#8b98ff; --brand-soft:#262c4f;
    --feedgas:#9d93f0; --lng:#5ea3f0; --cond:#f0814e; --brent:#3cc3c4; --jkm:#e877bf;
    --late:#ff8a8a; --late-bg:#3d1c22; --d7:#ffc85a; --d7-bg:#3a2e14; --d30:#8cbcff; --d30-bg:#1b2c4a;
    --done:#7ad99a; --done-bg:#163325; --plan:#b9bfd6; --plan-bg:#262b44; --rule:#c3aef5; --rule-bg:#2b2346;
    --series:#3987e5; --context:#6f7590; --santos:#199e70; --sk:#3987e5; --jera:#d95926; --other:#9aa0b8;
    --m-late:#d03b3b; --m-d7:#fab219; --m-d30:#8cb4f0; --m-plan:#6c7290; --m-done:#0ca30c; --m-miss:#898781; --miss:#c3c2b7; --miss-bg:#2c2f3a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0f1220; --card:#181c2e; --surface:#20253a; --border:#2b3150; --grid:#262b44; --axis:#3d4466;
  --text:#eef0f8; --text2:#b9bfd6; --muted:#868ca8;
  --brand:#8b98ff; --brand-soft:#262c4f;
  --feedgas:#9d93f0; --lng:#5ea3f0; --cond:#f0814e; --brent:#3cc3c4; --jkm:#e877bf;
  --late:#ff8a8a; --late-bg:#3d1c22; --d7:#ffc85a; --d7-bg:#3a2e14; --d30:#8cbcff; --d30-bg:#1b2c4a;
  --done:#7ad99a; --done-bg:#163325; --plan:#b9bfd6; --plan-bg:#262b44; --rule:#c3aef5; --rule-bg:#2b2346;
  --series:#3987e5; --context:#6f7590; --santos:#199e70; --sk:#3987e5; --jera:#d95926; --other:#9aa0b8;
    --m-late:#d03b3b; --m-d7:#fab219; --m-d30:#8cb4f0; --m-plan:#6c7290; --m-done:#0ca30c; --m-miss:#898781; --miss:#c3c2b7; --miss-bg:#2c2f3a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--text);font:14px/1.5 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 64px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 6px;color:var(--text2)}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.ref{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
input[type=date]{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
section{margin-bottom:14px}
.loader{border:2px dashed var(--axis);border-radius:14px;padding:28px 16px;text-align:center;background:var(--card)}
.loader.drag{border-color:var(--brand);background:var(--brand-soft)}
.loader p{margin:6px 0}
.filebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:12px}
.filebar.drag{border-color:var(--brand);background:var(--brand-soft)}
.filebar b{font-weight:700}
.privacy{font-size:12px;color:var(--muted)}
.sample{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;margin-bottom:12px;border:1.5px dashed var(--brand);border-radius:10px;background:var(--brand-soft);font-size:13px}
.sample span{color:var(--text2)}
.loadmsg{font-size:13px;margin-top:8px;color:var(--late)}
.banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--late-bg);color:var(--late);font-weight:600;font-size:13px;margin-bottom:12px}
.banner .btn{padding:3px 9px;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs.mid .tab,.tabs.sub .tab{font-size:12.5px;padding:6px 10px}
.tabs.sub{border-bottom:0;gap:6px}
.tabs.sub .tab{border:1px solid var(--border);border-radius:100px;margin:0}
.tabs.sub .tab[aria-selected=true]{background:var(--brand-soft);border-color:var(--brand)}
.placeholder{padding:28px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--axis);border-radius:12px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{background:var(--surface);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--text2);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:11.5px;color:var(--text2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card)}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top;white-space:nowrap}
td.w{white-space:normal;min-width:150px;max-width:260px}
th.num{text-align:right}
tr.flash td{animation:flash 2s ease}
@keyframes flash{0%,40%{background:var(--d7-bg)}100%{background:transparent}}
tr.sds td{background:color-mix(in srgb,var(--lng) 8%,var(--card))}
tr.sds td:first-child{box-shadow:inset 3px 0 0 var(--lng)}
.pill{display:inline-block;padding:1px 8px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap}
/* Lifter: 중립 pill + 색 점 (글자는 텍스트 색) */
.lifter{background:var(--surface);color:var(--text)}
.ldot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.ldot.santos{background:var(--santos)}.ldot.sk{background:var(--sk)}.ldot.jera{background:var(--jera)}.ldot.other{background:var(--other)}
.st-late{background:var(--late-bg);color:var(--late)}.st-d7{background:var(--d7-bg);color:var(--d7)}.st-d30{background:var(--d30-bg);color:var(--d30)}
.st-done{background:var(--done-bg);color:var(--done)}.st-plan{background:var(--plan-bg);color:var(--plan)}.st-rule{background:var(--rule-bg);color:var(--rule)}
.st-miss{background:var(--miss-bg);color:var(--miss)}
.sico{width:10px;height:10px;vertical-align:-1px;margin-right:4px;overflow:visible}
/* 마감 타임라인 */
.tl{margin:0 0 10px}
.tl svg{display:block;width:100%;height:auto;overflow:visible}
.tl .hit{cursor:default}
.rulestrip{font-size:12px;color:var(--text2);background:var(--surface);border-radius:8px;padding:6px 10px;margin:0 0 10px}
.rulestrip b{color:var(--text)}
/* 미입력: 빨간 글자 + ⊘ + 글자 (지연 ▲와 구분) */
.miss-in{color:var(--late);font-weight:700;white-space:nowrap}
.miss-txt{color:var(--late);font-weight:600}
.goto{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.goto:hover,.goto:focus-visible{text-decoration:underline}
.nexttask{font-size:13px;margin:0 0 10px;color:var(--text2)}
.nexttask .goto{color:var(--text)}
/* 카고 진행 막대 */
.prog{margin:0 0 10px}
.prog-h{font-size:12.5px;margin-bottom:4px}
.pbar{display:flex;gap:2px;height:12px;max-width:640px}
.pseg{min-width:4px}
.pseg:last-child{border-radius:0 4px 4px 0}
.ps-done{background:var(--m-done)}.ps-late{background:var(--m-late)}.ps-d7{background:var(--m-d7)}.ps-d30{background:var(--m-d30)}.ps-plan{background:var(--m-plan)}.ps-miss{background:var(--m-miss)}
.ps-rule{background:repeating-linear-gradient(135deg,var(--late) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--late)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text2);margin-top:5px}
.plegend b{color:var(--text)}
/* 한 줄 알림 */
.insight{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 12px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:10px;font-size:13.5px}
.insight .t{font-weight:600;flex:1 1 300px;min-width:0}
.insight .btn{padding:3px 9px;font-size:12px}
.more-ins{flex-basis:100%;font-size:12.5px;color:var(--text2)}
.more-ins summary{cursor:pointer;font-weight:600}
.more-ins ul{margin:6px 0 0;padding-left:4px;list-style:none;display:grid;gap:4px}
/* 체크리스트 편집 */
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.edbar .btn[disabled]{opacity:.45;cursor:not-allowed}
.edcount{font-size:12.5px;font-weight:700;color:var(--brand)}
.rowedit{border:1px solid var(--border);background:var(--card);border-radius:6px;padding:0 6px;margin-right:5px;font-size:12px;line-height:20px}
.rowedit:hover{border-color:var(--brand)}
.eddot{display:inline-block;margin-left:5px;font-size:11px;font-weight:700;color:var(--brand)}
tr.editrow td{background:var(--surface);white-space:normal}
/* 편집 폼은 넓은 표 안에 있어도 보이는 폭에 맞추고 가로 스크롤 시 왼쪽에 고정 */
.edform{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));width:min(1100px,calc(100vw - 80px));position:sticky;left:8px}
.ef{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text2);font-weight:600}
.ef.wide{grid-column:1/-1}
.ef input,.ef textarea{font:inherit;font-weight:400;font-size:13px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);min-width:0}
.edbtns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
/* 달성률 막대 */
.ach{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.ach .bar{position:relative;width:84px;height:8px;background:var(--grid);border-radius:0 4px 4px 0}
.ach .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--series);border-radius:0 4px 4px 0}
.ach .bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--text2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--border);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--card)}
.chip[aria-pressed=true]{outline:2px solid var(--brand);outline-offset:1px}
.nextdue{font-size:12.5px;margin:0 0 10px;color:var(--text2)}
.items{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:220px;max-width:420px}
.items.open{display:block}
.more{border:0;background:none;color:var(--brand);font-size:11.5px;font-weight:700;padding:2px 0}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chart-legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:16px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:4px}
.chart-legend i.dash{border-top-style:dashed}
.chart-legend i.thin{border-top-width:1px}
.chart-legend i.dot{border-top-style:dotted}
.chart-legend .tri{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--text2);margin-right:4px}
.chart-flag{font-size:12px;color:var(--late);margin:4px 0 0;font-weight:600}
#tip{position:fixed;pointer-events:none;z-index:100;background:var(--card);color:var(--text2);border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}
#tip .tr{display:flex;align-items:center;gap:6px}
#tip .tr b{color:var(--text)}
#tip .k{display:inline-block;width:12px;border-top:2px solid}
#tip .hd{color:var(--muted);margin-bottom:2px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.hdrcard{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-bottom:12px}
.hdrcard div{background:var(--surface);border-radius:8px;padding:8px 10px}
.hdrcard .l{font-size:11.5px;color:var(--text2);font-weight:600}
.hdrcard .v{font-weight:700;font-variant-numeric:tabular-nums}
details.check{margin-top:16px}
details.check summary{cursor:pointer;font-weight:700;font-size:13.5px}
.check ul{margin:8px 0 0;padding-left:18px;font-size:12.5px}
.check li.warn{color:var(--late)}
.check li.info{color:var(--text2)}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);padding:0;width:min(640px,calc(100vw - 32px));max-height:80vh}
dialog::backdrop{background:rgba(10,12,25,.45)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.dlg-b{padding:10px 16px 16px;overflow:auto;max-height:calc(80vh - 60px)}
.alert-item{display:flex;gap:8px;width:100%;text-align:left;align-items:baseline;border:0;border-bottom:1px solid var(--grid);background:none;padding:8px 2px;font-size:12.5px}
.alert-item:hover{background:var(--surface)}
.alert-item .w{flex:1;min-width:0}
.print-head{display:none}
/* ===== 인쇄: A4 가로, 화면 축소 없이 본문 8pt 이상, 잘림 없음 ===== */
@page{size:A4 landscape;margin:10mm}
@media print{
  /* 어두운 테마여도 밝게 인쇄 (화면용 다크 규칙보다 뒤에 두어 우선) */
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    color-scheme:light;
    --page:#fff; --card:#fff; --surface:#f1f2f6; --border:#cfd3df; --grid:#e3e5ec; --axis:#b9bfcf;
    --text:#111; --text2:#3d4255; --muted:#666b80; --brand:#3a4bd8; --brand-soft:#eef0fd;
    --series:#2a78d6; --context:#8f92a3; --santos:#1baf7a; --sk:#2a78d6; --jera:#eb6834; --other:#8a90a6; --lng:#2a78d6;
    --late:#b42626; --late-bg:#fde8e8; --d7:#8a5800; --d7-bg:#fff2d6; --d30:#1d5fb8; --d30-bg:#e3eefc;
    --done:#1d7a3a; --done-bg:#e2f4e7; --plan:#4a5068; --plan-bg:#eef0f6; --rule:#6b4fa8; --rule-bg:#efeafa;
    --miss:#55586a; --miss-bg:#ececef; --m-d30:#5a86cf; --m-plan:#a3a8ba;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important;color:#111;font-size:9pt}
  .wrap{max-width:none;width:auto;padding:0}
  .no-print,.tabs,.banner,.filebar,details.check,#tip,dialog,#loader{display:none!important}
  header.top{margin-bottom:2mm}
  h1{font-size:13pt} h2{font-size:10.5pt;margin-bottom:2mm} h3{font-size:9pt}
  h2,h3{break-after:avoid}
  .print-head{display:flex;flex-wrap:wrap;gap:1mm 6mm;font-size:8.5pt;color:#333;border-bottom:1px solid #999;padding-bottom:1.5mm;margin-bottom:3mm}
  .print-head .sb{border:1px dashed #555;padding:0 2mm;font-weight:700}
  .sample:not([hidden]){display:none!important}
  /* 큰 덩어리는 쪼개지게, 작은 단위만 붙여 둠 */
  section,.card,.grid{break-inside:auto}
  .card{box-shadow:none;border-color:#cfd3df;padding:3mm;border-radius:2mm}
  section{margin-bottom:3mm}
  .grid{gap:3mm}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:2mm}
  .kpi,.chartbox,.hdrcard,.chart-legend,.tl,.rulestrip,tr,.nextdue,.nexttask,.prog{break-inside:avoid}
  .nexttask{font-size:9pt}
  .pbar{max-width:none}
  .plegend{font-size:8pt}
  .kpi{padding:2mm 3mm} .kpi .v{font-size:13pt}
  .chartbox svg{max-height:58mm}
  .chartbox svg text,.tl svg text{font-size:12.5px}
  .chart-legend,.note,.chart-flag{font-size:8pt}
  /* 표: 스크롤 래퍼 없이, 고정 폭, 긴 글은 줄바꿈 */
  .tw{overflow:visible!important}
  table{width:100%;table-layout:fixed;font-size:8pt}
  thead{display:table-header-group}
  th,td{white-space:normal!important;overflow-wrap:anywhere;padding:1.2mm 1.5mm}
  th{font-size:7.8pt}
  td.num{white-space:nowrap!important}
  td.w{min-width:0;max-width:none}
  .items{display:block;-webkit-line-clamp:unset;max-width:none;min-width:0;overflow:visible}
  .more{display:none}
  .pill{font-size:7.5pt;padding:0 1.5mm;white-space:nowrap}
  .pill.lifter{white-space:normal}

  table.t-chk th:nth-child(10){width:6%} table.t-chk th:nth-child(11){width:24%}
  table.t-lng th:nth-child(1){width:10%} table.t-lng th:nth-child(2){width:21%} table.t-lng th:nth-child(3){width:7%} table.t-lng th:nth-child(4){width:13%}
  table.t-lng th:nth-child(5){width:11%} table.t-lng th:nth-child(6){width:9%} table.t-lng th:nth-child(7){width:17%} table.t-lng th:nth-child(8){width:12%}
  table.t-cond th:nth-child(1){width:12%} table.t-cond th:nth-child(2){width:19%} table.t-cond th:nth-child(3){width:9%} table.t-cond th:nth-child(4){width:17%}

<body>
<div class="wrap">
  <header class="top">
    <h1>Barossa 운영 대시보드</h1>
    <div class="controls no-print">
      <label class="ref">기준일 <input type="date" id="refDate"></label>
      <button class="btn" id="btnPrint" type="button">PDF 출력</button>
      <button class="btn" id="btnExport" type="button">엑셀 내보내기</button>
      <button class="btn" id="btnTheme" type="button" aria-label="밝게/어둡게 전환">🌓 테마</button>
    </div>
  </header>
  <div class="print-head" id="printHead"></div>

  <div id="loader" class="loader no-print">
    <p><b>엑셀 워크북을 이 영역에 끌어다 놓거나 아래 버튼으로 선택하세요.</b></p>
    <p class="controls" style="justify-content:center;margin:12px 0">
      <button class="btn primary" type="button" data-pick="ledger">Ledger 워크북</button>
      <button class="btn primary" type="button" data-pick="check">체크리스트 워크북 (Dashboard)</button>
    </p>
    <p class="privacy">파일은 이 브라우저 안에서만 읽고, 어디에도 전송·저장하지 않습니다.</p>
    <p class="muted" style="font-size:12px">두 파일 중 하나만 불러와도 됩니다. 시트 이름으로 어떤 파일인지 자동 판별합니다.</p>
    <p style="margin-top:16px"><button class="btn" type="button" data-act="sample">샘플 데이터로 보기</button></p>
    <p class="muted" style="font-size:12px">실제 데이터가 아닌 임의 생성 값으로 화면 구성을 보여 줍니다.</p>
    <div class="loadmsg" id="loadMsg" role="alert"></div>
  </div>
  <div id="sampleBadge" class="sample" role="status" hidden><b>샘플 데이터 — 실제 값 아님</b><span>임의 생성 값으로 화면 구성만 보여 줍니다.</span><button class="btn no-print" type="button" data-act="real">실제 파일 불러오기</button></div>
  <div id="filebar" class="filebar no-print" hidden></div>
  <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" multiple hidden>

  <div id="banner" class="banner" hidden></div>
  <div id="app" hidden></div>
  <details class="check" id="matchPanel" hidden><summary>시트 매칭</summary><div id="matchBody"></div></details>
  <details class="check" id="checkPanel" hidden><summary>데이터 점검</summary><div id="checkBody"></div></details>
</div>
<div id="tip" role="tooltip"></div>
<dialog id="alertDlg" aria-labelledby="alertTitle">
  <div class="dlg-h"><b id="alertTitle">기한 알림</b><button class="btn" type="button" id="alertClose">닫기</button></div>
  <div class="dlg-b" id="alertBody"></div>

<script id="model">
// ===== 워크북 → 데이터 모델 (DOM 없음, 헤더 텍스트로 위치 탐색) =====
const M = (() => {
  const DAY = 864e5;
  const MIN_DAY = Date.UTC(1950, 0, 1) / DAY, MAX_DAY = Date.UTC(2100, 0, 1) / DAY;
  const ERR = {0x00:'#NULL!',0x07:'#DIV/0!',0x0F:'#VALUE!',0x17:'#REF!',0x1D:'#NAME?',0x24:'#NUM!',0x2A:'#N/A',0x2B:'#GETTING_DATA'};
  class XErr { constructor(code){ this.code = code; } toString(){ return this.code; } }
  const isErr = v => v instanceof XErr;
  const isNum = v => typeof v === 'number' && isFinite(v);
  const isEmpty = v => v == null || (typeof v === 'string' && v.trim() === '');
  const norm = v => v == null || isErr(v) ? '' : String(v).replace(/\s+/g, ' ').trim().toLowerCase();

  // Date 객체: 로컬/UTC 자정 어느 쪽이든 +12h 후 로컬 날짜로 반올림
  function asDay(v){
    let d = null;
    if (v instanceof Date && !isNaN(v)) { const t = new Date(v.getTime() + 12 * 3600e3); d = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY; }
    else if (isNum(v)) d = Math.round(v) - 25569;
    return d != null && d >= MIN_DAY && d < MAX_DAY ? d : null;
  }
  const iso = d => d == null ? '–' : new Date(d * DAY).toISOString().slice(0, 10);
  const todayDay = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / DAY; };
  const colName = c => XLSX.utils.encode_col(c);
  const addr = (r, c) => colName(c) + (r + 1);

  function cellValue(cell){
    if (!cell) return null;
    switch (cell.t) {
      case 'e': return new XErr(cell.w || ERR[cell.v] || '#ERR');
      case 'd': case 'n': case 'b': return cell.v;
      case 's': return String(cell.v);
      default: return null;
    }
  }
  // 텍스트 날짜: 셀 전체가 날짜 형식일 때만 인정 (뒤에 글자가 붙으면 날짜 아님 → 규칙 텍스트로 남김)
  // 빗금·점 형식은 일-월-연 (호주·한국 관행). 앞 두 값이 모두 12 이하이면 모호 표시
  function textDate(s){
    const t = s.trim(); let m, y, mo, d, amb = false;
    if ((m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) [y, mo, d] = [+m[1], +m[2], +m[3]];
    else if ((m = t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))) { [d, mo, y] = [+m[1], +m[2], +m[3]]; amb = d <= 12 && mo <= 12 && d !== mo; }
    else return null;
    const dt = new Date(y, mo - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d ? { dt, amb } : null;
  }
  // 텍스트 숫자: 공백·천 단위 쉼표 허용 ("1,234", " 42 ")
  const NUMRE = /^\s*-?(\d{1,3}(,\d{3})+|\d+)(\.\d+)?\s*$/;
  let CUR = null;   // 지금 파싱 중인 ctx (텍스트 숫자 변환 기록용, 파싱은 동기라 안전)
  function numAt(g, r, c, header){
    const v = at(g, r, c);
    if (isNum(v)) return v;
    if (typeof v === 'string' && NUMRE.test(v)) { CUR && CUR.tn(g.name, header || colName(c) + '열'); return +v.replace(/[,\s]/g, ''); }
    return null;
  }
  function grid(ws, name, notes = []){
    const rows = [];
    if (!ws || !ws['!ref']) return { rows, merges: [], name, notes };
    const R = XLSX.utils.decode_range(ws['!ref']);
    for (let r = 0; r <= R.e.r; r++) {
      const row = new Array(R.e.c + 1).fill(null);
      for (let c = 0; c <= R.e.c; c++) {
        let v = cellValue(ws[XLSX.utils.encode_cell({ r, c })]);
        if (typeof v === 'string') v = v.replace(/\r\n?/g, '\n');   // 줄바꿈 정규화 (엑셀·XML 해석과 같게)
        if (typeof v === 'string') { const t = textDate(v); if (t) { notes.push({ a: XLSX.utils.encode_cell({ r, c }), raw: v.trim(), amb: t.amb }); v = t.dt; } }
        row[c] = v;
      }
      rows.push(row);
    }
    return { rows, merges: ws['!merges'] || [], name, notes };
  }
  const at = (g, r, c) => (g.rows[r] || [])[c] ?? null;
  function find(g, pred, o = {}){
    const r1 = Math.min(o.r1 ?? Infinity, g.rows.length - 1);
    for (let r = o.r0 || 0; r <= r1; r++) {
      const row = g.rows[r] || [];
      const c1 = Math.min(o.c1 ?? Infinity, row.length - 1);
      for (let c = o.c0 || 0; c <= c1; c++) if (pred(norm(row[c]), r, c)) return { r, c };
    }
    return null;
  }
  const findText = (g, t, o) => find(g, s => s === t, o);
  const findStart = (g, t, o) => find(g, s => s.startsWith(t), o);
  function rightValue(g, r, c, steps = 8){
    for (let k = 1; k <= steps; k++) { const v = at(g, r, c + k); if (!isEmpty(v)) return v; }
    return null;
  }

  function makeCtx(wb, m){
    const cache = {}, issues = [], tnums = {};
    m.err = {};   // 카드별 실패 사유: 시트 없음 / 헤더 없음 (빈 데이터와 구분)
    const ctx = {
      issues,
      warn: (sheet, header, msg) => issues.push({ level: 'warn', sheet, header, msg }),
      info: (sheet, header, msg) => issues.push({ level: 'info', sheet, header, msg }),
      // 카드에 보일 실패 사유 + 데이터 점검 경고
      fail(sec, sheet, header){
        m.err[sec] = header ? `'${sheet}' 시트에서 필요한 헤더 '${header}'를 찾지 못했습니다` : `필요한 시트 '${sheet}'를 찾지 못했습니다`;
        if (header) ctx.warn(sheet, header, '필요한 헤더를 찾지 못함 — 관련 카드/열을 "–"로 표시');
      },
      sheet(name, sec){
        if (!wb.Sheets[name]) { ctx.warn(name, '(시트)', '필요한 시트를 찾지 못함 — 관련 카드에 표시'); if (sec) ctx.fail(sec, name); return null; }
        if (cache[name]) return cache[name];
        const g = cache[name] = grid(wb.Sheets[name], name);
        const n = g.notes;
        if (n.length) ctx.info(name, '텍스트 날짜', `텍스트로 입력된 날짜 ${n.length}개를 날짜로 읽음 (예: ${n[0].a} "${n[0].raw}")`);
        n.filter(x => x.amb).forEach(x => ctx.info(name, x.a, `"${x.raw}" — 일/월 순서가 모호해 일-월-연으로 읽음`));
        return g;
      },
      tn(sheet, header){ const k = sheet + '\u0000' + header; tnums[k] = (tnums[k] || 0) + 1; },
      // 파싱 끝에 텍스트 숫자 변환 건수를 시트·열별로 한 줄씩
      flush(){ Object.entries(tnums).forEach(([k, n]) => { const [s, h] = k.split('\u0000'); ctx.info(s, h, `텍스트로 입력된 숫자 ${n}개를 숫자로 변환`); }); },
      // 숫자면 숫자, 오류/공백이면 null (오류는 기록)
      num(sheet, header, g, r, c){
        const v = at(g, r, c);
        if (isErr(v)) { ctx.warn(sheet, header, `${addr(r, c)} 셀이 ${v.code} — 건너뜀`); return null; }
        return numAt(g, r, c, header);
      }
    };
    CUR = ctx;
    return ctx;
  }

  // 날짜열 + 값열들 → 행 목록 {r, d, v:{k:number|null}, e:{k:errcode}}. names: 텍스트 숫자 기록용 열 이름
  function readDated(g, startRow, dateCol, cols, names = {}){
    const out = [];
    for (let r = startRow; r < g.rows.length; r++) {
      const d = asDay(at(g, r, dateCol));
      if (d == null) continue;
      const v = {}, e = {};
      for (const k in cols) { const x = at(g, r, cols[k]); v[k] = numAt(g, r, cols[k], names[k]); if (isErr(x)) e[k] = x.code; }
      out.push({ r, d, v, e });
    }
    return out;
  }
  function summarizeErrs(ctx, sheet, header, rows, key, boundary){
    const before = rows.filter(x => x.e[key] && (boundary == null || x.d <= boundary));
    const after = rows.filter(x => x.e[key] && boundary != null && x.d > boundary);
    if (before.length) ctx.warn(sheet, header, `오류값 ${before.length}행(예: ${before[0].e[key]}, ${iso(before[0].d)}) — "–" 처리`);
    if (after.length) ctx.info(sheet, header, `최신 실적일 이후 오류값 ${after.length}행(${after[0].e[key]})은 미입력 미래 행으로 보고 제외`);
  }
  // 같은 행에 Date / Production / Inventory 헤더가 모인 곳
  function findLedgerHeader(g){
    return find(g, (s, r, c) => {
      if (s !== 'date') return false;
      const row = g.rows[r].map(norm);
      const p = row.indexOf('production', c + 1), i = row.indexOf('inventory', c + 1);
      return p > c && p - c <= 6 && i > c && i - c <= 6;
    });
  }

  // ---------- Ledger 워크북 ----------
  function parseLedger(wb){
    const m = {}, ctx = makeCtx(wb, m); m.issues = ctx.issues;

    // Feed Gas 실적: "Actual" 아래 단위행 "MMscf"
    m.feedGas = [];
    const fg = ctx.sheet('Feed Gas', 'fg');
    if (fg) {
      const a = findText(fg, 'actual', { r1: 20 }), dt = findText(fg, 'date', { r1: 20 });
      let u = null;
      if (a) for (let r = a.r + 1; r <= a.r + 2 && !u; r++) for (let c = a.c; c <= a.c + 3; c++) if (norm(at(fg, r, c)) === 'mmscf') { u = { r, c }; break; }
      if (!a || !dt || !u) ctx.fail('fg', 'Feed Gas', !dt ? 'Date' : !a ? 'Actual' : 'Actual → MMscf');
      else {
        // Nomination: 같은 헤더 행, Actual 왼쪽 → 단위행 MMscf
        const n = findText(fg, 'nomination', { r0: a.r, r1: a.r, c1: a.c - 1 });
        let un = null;
        if (n) for (let c = n.c; c < a.c && !un; c++) if (norm(at(fg, u.r, c)) === 'mmscf') un = { r: u.r, c };
        if (!un) ctx.warn('Feed Gas', 'Nomination → MMscf', '헤더를 찾지 못해 Nomination 선을 생략');
        const rows = readDated(fg, u.r + 1, dt.c, un ? { v: u.c, n: un.c } : { v: u.c }, { v: 'Actual MMscf', n: 'Nomination MMscf' });
        m.feedGas = rows.map(x => ({ d: x.d, v: x.v.v, n: un ? x.v.n : null }));
        m.feedGasCol = addr(u.r, u.c); m.nomCol = un ? addr(un.r, un.c) : null;
        const act = rows.filter(x => x.v.v != null);
        m.lastActual = act.length ? act[act.length - 1].d : null;
        summarizeErrs(ctx, 'Feed Gas', 'Actual MMscf', rows, 'v', m.lastActual);
        if (un) summarizeErrs(ctx, 'Feed Gas', 'Nomination MMscf', rows, 'n', m.lastActual);
      }
    }
    if (m.lastActual == null) ctx.warn('Feed Gas', 'Actual MMscf', '최신 실적일을 정하지 못해 실적/예측 구분을 기준일 전날로 대신합니다.');

    // Forecast: "Date"+"Feed Gas" 헤더 블록 중 날짜 행이 가장 많은 블록
    m.fgForecast = [];
    const fc = ctx.sheet('Forecast', 'fc');
    if (fc) {
      let best = null;
      for (let r = 0; r < Math.min(fc.rows.length, 80); r++) fc.rows[r].forEach((v, c) => {
        if (norm(v) !== 'feed gas') return;
        let dc = -1; for (let k = c - 1; k >= 0; k--) if (norm(at(fc, r, k)) === 'date') { dc = k; break; }
        if (dc < 0) return;
        const rows = readDated(fc, r + 1, dc, { v: c }, { v: 'Feed Gas' });
        if (!best || rows.length > best.rows.length) best = { r, c, dc, rows };
      });
      if (!best) ctx.fail('fc', 'Forecast', 'Date / Feed Gas');
      else {
        m.fgForecast = best.rows.map(x => ({ d: x.d, v: x.v.v, e: x.e.v }));
        m.fgForecastCol = `${addr(best.r, best.dc)} Date / ${addr(best.r, best.c)} Feed Gas`;
      }
    }

    // LNG / Condensate 원장: Date·Production·Inventory
    const ledger = (name, key) => {
      const g = ctx.sheet(name, key); if (!g) return [];
      const h = findLedgerHeader(g);
      if (!h) { ctx.fail(key, name, 'Date / Production / Inventory'); return []; }
      const row = g.rows[h.r].map(norm);
      const rows = readDated(g, h.r + 1, h.c, { p: row.indexOf('production', h.c + 1), i: row.indexOf('inventory', h.c + 1) }, { p: 'Production', i: 'Inventory' });
      summarizeErrs(ctx, name, 'Production', rows, 'p', m.lastActual);
      summarizeErrs(ctx, name, 'Inventory', rows, 'i', m.lastActual);
      m[key + 'Hdr'] = `${name}!${addr(h.r, h.c)}`;
      // 기준선: 헤더 위 블록(날짜열과 같은 열)의 라벨 → 오른쪽 첫 숫자 (원장 수식이 참조하는 값). 같은 행의 LC 기준·PSA/DLNG 값은 참고로만 기록
      m[key + 'Ref'] = [['working capacity', 'Working Capacity'], ['tank top', 'Tank Top'], ['unpumpable', 'Unpumpable']].map(([t, label]) => {
        const c = find(g, (s, r, cc) => cc === h.c && s === t, { r1: h.r - 1 });
        if (!c) { ctx.warn(name, label, '라벨을 찾지 못해 기준선을 생략'); return null; }
        const nums = []; for (let k = c.c + 1; k < c.c + 8; k++) { const v = at(g, c.r, k), n = numAt(g, c.r, k, label); if (n != null) nums.push({ k, v: n }); else if (isErr(v)) ctx.warn(name, label, `${addr(c.r, k)} ${v.code}`); }
        const pick = nums[0];
        if (!pick) { ctx.warn(name, label, '값이 숫자가 아니어서 기준선을 생략'); return null; }
        if (nums.length > 1) ctx.info(name, label, `같은 행에 값 ${nums.length}개(${nums.map(x => addr(c.r, x.k) + '=' + x.v.toLocaleString('en-US')).join(', ')}) — 원장 수식 기준 첫 값 ${addr(c.r, pick.k)} 사용`);
        return { key: t, label, v: pick.v };
      }).filter(Boolean);
      return rows.map(x => ({ d: x.d, p: x.v.p, i: x.v.i }));
    };
    m.lng = ledger('Ledger_ADP 및 SDS', 'lng');
    m.cond = ledger('Condensate Ledger', 'cond');
    // 예측 재고가 0 미만 / Tank Top(없으면 Working Capacity) 초과인 구간 — 선은 자르지 않고 표시만
    const flags = (rows, refs, name) => {
      const lim = (refs || []).find(r => r.key === 'tank top') || (refs || []).find(r => r.key === 'working capacity');
      const out = [], add = (kind, d) => { const l = out[out.length - 1]; if (l && l.kind === kind && l.d1 === d - 1) l.d1 = d; else out.push({ kind, d0: d, d1: d }); };
      rows.forEach(x => { if (m.lastActual == null || x.d <= m.lastActual || x.i == null) return; if (x.i < 0) add('neg', x.d); else if (lim && x.i > lim.v) add('over', x.d); });
      out.forEach(f => { f.text = f.kind === 'neg' ? '예측 재고가 0 미만' : `예측 재고가 ${lim.label} 초과`; ctx.info(name, 'Inventory', `${f.text}: ${iso(f.d0)} ~ ${iso(f.d1)} (선은 그대로 표시)`); });
      return out;
    };
    m.lngFlags = flags(m.lng, m.lngRef, 'Ledger_ADP 및 SDS');
    m.condFlags = flags(m.cond, m.condRef, 'Condensate Ledger');

    // LNG Lifting (ADP 및 SDS)
    m.lngLift = { slots: [] };
    const adp = ctx.sheet('ADP 및 SDS', 'lngLift');
    if (adp) {
      const h = find(adp, (s, r) => s === 'slot number' && adp.rows[r].some(v => norm(v) === 'lifting slot'), { r1: 30 });
      if (!h) ctx.fail('lngLift', 'ADP 및 SDS', 'Slot Number / Lifting Slot');
      else {
        const row = adp.rows[h.r].map(norm);
        const col = t => { const i = row.indexOf(t); if (i < 0) ctx.warn('ADP 및 SDS', t, '헤더 없음 — "–" 표시'); return i; };
        const C = { ls: col('lifting slot'), lifter: col('lifter'), plan: col('cargo size (planned_cbm)'), act: col('cargo size (actual_cbm)'), vessel: col('proposed vessel') };
        const iss = findText(adp, 'issue', { r1: h.r }); m.lngLift.issue = iss ? asDay(rightValue(adp, iss.r, iss.c)) : null;
        if (!iss) ctx.warn('ADP 및 SDS', 'Issue', '라벨 없음');
        const lc = findStart(adp, 'last confirmed sds slot', { r1: h.r });
        m.lngLift.lastSds = lc ? norm(rightValue(adp, lc.r, lc.c)) : '';
        if (!lc) ctx.warn('ADP 및 SDS', 'last confirmed SDS slot', '라벨 없음 — SDS 확정 표시 생략');
        let noDate = 0, sds = !!m.lngLift.lastSds;
        for (let r = h.r + 1; r < adp.rows.length; r++) {
          const slot = at(adp, r, h.c);
          if (isEmpty(slot)) break;
          const start = asDay(at(adp, r, C.ls));
          let end = null; for (let c = C.ls + 1; c < (C.lifter > 0 ? C.lifter : C.ls + 4); c++) { const d = asDay(at(adp, r, c)); if (d != null) { end = d; break; } }
          const isSds = sds;
          if (norm(slot) === m.lngLift.lastSds) sds = false;
          if (start == null) { noDate++; continue; }
          m.lngLift.slots.push({ r, slot: String(slot), start, end, sds: isSds && !!m.lngLift.lastSds,
            lifter: at(adp, r, C.lifter), plan: C.plan >= 0 ? ctx.num('ADP 및 SDS', 'Cargo Size (Planned_cbm)', adp, r, C.plan) : null,
            act: C.act >= 0 ? ctx.num('ADP 및 SDS', 'Cargo Size (Actual_cbm)', adp, r, C.act) : null, vessel: C.vessel >= 0 ? at(adp, r, C.vessel) : null });
        }
        if (noDate) ctx.info('ADP 및 SDS', 'Lifting Slot', `Lifting Slot 날짜가 없는 슬롯 ${noDate}개는 일정에서 제외`);
      }
    }

    // Condensate Lifting (LP) — 슬롯번호 빈 행은 직전 슬롯의 Lifter 분할
    m.condLift = { slots: [] };
    const lp = ctx.sheet('LP', 'condLift');
    if (lp) {
      const h = find(lp, (s, r) => s === 'slot number' && lp.rows[r].some(v => norm(v) === 'lifting slot'), { r1: 20 });
      if (!h) ctx.fail('condLift', 'LP', 'Slot Number / Lifting Slot');
      else {
        const row = lp.rows[h.r].map(norm);
        const col = t => { const i = row.indexOf(t); if (i < 0) ctx.warn('LP', t, '헤더 없음 — "–" 표시'); return i; };
        const C = { ls: col('lifting slot'), lifter: col('lifter'), plan: col('cargo size (planned_bbl)'), act: col('cargo size (actual_bbl)'), vessel: col('proposed vessel') };
        const iss = findText(lp, 'issue', { r1: h.r }); m.condLift.issue = iss ? asDay(rightValue(lp, iss.r, iss.c)) : null;
        let cur = null;
        for (let r = h.r + 1; r < lp.rows.length; r++) {
          const slot = at(lp, r, h.c), lifter = C.lifter >= 0 ? at(lp, r, C.lifter) : null;
          const part = { lifter, plan: C.plan >= 0 ? ctx.num('LP', 'Cargo Size (Planned_bbl)', lp, r, C.plan) : null, act: C.act >= 0 ? ctx.num('LP', 'Cargo Size (Actual_bbl)', lp, r, C.act) : null };
          if (!isEmpty(slot)) {
            let end = null; for (let c = C.ls + 1; c < (C.lifter > 0 ? C.lifter : C.ls + 4); c++) { const d = asDay(at(lp, r, c)); if (d != null) { end = d; break; } }
            cur = { r, slot: String(slot), start: asDay(at(lp, r, C.ls)), end, parts: [part], vessel: C.vessel >= 0 ? at(lp, r, C.vessel) : null };
            m.condLift.slots.push(cur);
          } else if (!isEmpty(lifter) && cur) cur.parts.push(part);
          else break;
        }
      }
    }

    // 생산 실적 vs 계획 (Operation Daily)
    m.prod = null;
    const od = ctx.sheet('Operation Daily', 'prod');
    if (od) {
      const t = findText(od, 'barossa & dlng production');
      if (!t) ctx.fail('prod', 'Operation Daily', 'Barossa & DLNG Production');
      else {
        const a = findText(od, 'actual', { r0: t.r + 1, r1: t.r + 6, c0: t.c + 1 });
        const p = a && findStart(od, 'plan', { r0: a.r, r1: a.r, c0: a.c + 1 });
        const v = a && findText(od, 'actual vs plan', { r0: a.r, r1: a.r, c0: a.c + 1 });
        if (!a || !p || !v) ctx.fail('prod', 'Operation Daily', !a ? 'Actual' : !p ? 'Plan…' : 'Actual vs Plan');
        else {
          const cols = [a.c, a.c + 1, a.c + 2, p.c, p.c + 1, v.c, v.c + 1];
          m.prod = { day: asDay(at(od, a.r + 1, a.c)), planLabel: String(at(od, p.r, p.c)).trim(), rows: [] };
          let group = '';
          for (let r = a.r + 2; r < od.rows.length; r++) {
            const lab = at(od, r, t.c);
            let sub = ''; for (let c = t.c + 1; c < a.c; c++) if (typeof at(od, r, c) === 'string' && at(od, r, c).trim()) { sub = at(od, r, c).trim(); break; }
            const vals = cols.map(c => at(od, r, c));
            if (isEmpty(lab) && !sub && vals.every(isEmpty)) break;
            if (!isEmpty(lab)) group = String(lab).trim();
            m.prod.rows.push({ group, sub, vals: vals.map((x, k) => { if (isErr(x)) { ctx.warn('Operation Daily', group + ' ' + sub, `${addr(r, cols[k])} ${x.code} — "–" 처리`); return null; } return numAt(od, r, cols[k], group); }) });
          }
          for (const want of ['feed gas export', 'lng', 'condensate'])
            if (!m.prod.rows.some(x => norm(x.group).startsWith(want))) ctx.warn('Operation Daily', want, '행을 찾지 못함');
        }
      }
    }

    // Brent · JKM
    m.price = { daily: [], monthly: [] };
    const bj = ctx.sheet('BrentnJKM', 'price');
    if (bj) {
      const h = find(bj, (s, r) => s === '날짜' && bj.rows[r].some(v => norm(v) === 'brent가격'), { r1: 10 });
      if (!h) ctx.fail('price', 'BrentnJKM', '날짜 / Brent가격');
      else {
        const row = bj.rows[h.r].map(norm);
        const b = row.indexOf('brent가격'), j = row.indexOf('jkm가격'), bm = row.indexOf('brent 월평균'), jm = row.indexOf('jkm 월평균');
        if (j < 0) ctx.warn('BrentnJKM', 'JKM가격', '헤더 없음');
        const daily = readDated(bj, h.r + 1, h.c, { b, j }, { b: 'Brent가격', j: 'JKM가격' });
        summarizeErrs(ctx, 'BrentnJKM', 'Brent가격', daily, 'b', null); summarizeErrs(ctx, 'BrentnJKM', 'JKM가격', daily, 'j', null);
        m.price.daily = daily.map(x => ({ d: x.d, b: x.v.b, j: x.v.j }));
        let mc = -1; if (bm >= 0) for (let k = bm - 1; k >= 0; k--) if (row[k] === '월') { mc = k; break; }
        if (bm < 0 || mc < 0) ctx.warn('BrentnJKM', '월 / Brent 월평균', '월평균 헤더를 찾지 못함');
        else {
          const mon = readDated(bj, h.r + 1, mc, { b: bm, j: jm }, { b: 'Brent 월평균', j: 'JKM 월평균' });
          let last = -1; mon.forEach((x, k) => { if (x.v.b != null || x.v.j != null) last = k; });
          const kept = mon.slice(0, last + 1), dropped = mon.length - kept.length;
          kept.forEach(x => { for (const k in x.e) ctx.warn('BrentnJKM', k === 'b' ? 'Brent 월평균' : 'JKM 월평균', `${iso(x.d).slice(0, 7)} ${x.e[k]} — "–" 처리`); });
          if (dropped) ctx.info('BrentnJKM', '월평균', `값이 없는 이후 월 ${dropped}개(오류값 포함)는 표에서 제외`);
          m.price.monthly = kept.map(x => ({ d: x.d, b: x.v.b, j: x.v.j }));
        }
      }
    }
    ctx.flush();
    return m;
  }

  // ---------- 체크리스트 워크북 ----------
  // 헤더 2행(병합)에서 텍스트로 열 찾기
  function headerCols(g, rows, names){
    const out = {};
    for (const n of names) { out[n] = -1; for (const r of rows) { const i = (g.rows[r] || []).map(norm).indexOf(n); if (i >= 0) { out[n] = i; break; } } }
    return out;
  }
  const strOf = v => isEmpty(v) || isErr(v) ? '' : (v instanceof Date ? iso(asDay(v)) : String(v).trim());
  function readItem(ctx, sheet, g, r, H){
    const s = k => H[k] >= 0 ? strOf(at(g, r, H[k])) : '';
    return { r, contract: s('contract'), clauses: s('clauses'), from: s('from'), to: s('to'), event: s('event'), items: H['items covered'] >= 0 && typeof at(g, r, H['items covered']) === 'string' ? at(g, r, H['items covered']).trim() : s('items covered') };
  }
  function dueActual(ctx, sheet, g, r, dueC, actC, item){
    const dv = at(g, r, dueC), av = actC >= 0 ? at(g, r, actC) : null;
    if (isErr(dv)) ctx.warn(sheet, 'Due Date', `${addr(r, dueC)} ${dv.code} — "–" 처리`);
    if (isErr(av)) ctx.warn(sheet, 'Actual', `${addr(r, actC)} ${av.code} — 미완료로 간주`);
    item.dueDay = dv instanceof Date ? asDay(dv) : null;   // 텍스트 날짜는 grid()에서 이미 Date로 바뀜
    item.dueText = item.dueDay == null ? strOf(dv) : '';
    item.actualDay = av instanceof Date ? asDay(av) : null;
    item.actualText = item.actualDay == null ? strOf(av) : '';
    return item;
  }
  function parseCheck(wb){
    const m = { sheets: [], cargo: null, schedule: null, history: null }, ctx = makeCtx(wb, m); m.issues = ctx.issues;
    const H_NAMES = ['contract', 'clauses', 'from', 'to', 'event', 'items covered', 'due', 'due date', 'actual'];
    for (const name of ['ADP Process', 'Annual', 'Monthly']) {
      const g = ctx.sheet(name, name);
      const h = g && findText(g, 'contract', { r1: 30 });
      if (g && !h) ctx.fail(name, name, 'Contract');
      if (!h) { m.sheets.push({ name, cy: null, rows: [], extras: [], err: m.err[name] }); continue; }
      const H = headerCols(g, [h.r, h.r + 1], H_NAMES);
      for (const k of H_NAMES) if (H[k] < 0) ctx.warn(name, k.replace(/\b[a-z]/g, x => x.toUpperCase()), '필요한 헤더를 찾지 못함 — 이 열은 "–"로 표시');
      const cy = findText(g, 'cy start', { r1: h.r + 1 });
      const cyDay = cy ? asDay(rightValue(g, cy.r, cy.c, 3)) : null;
      if (cyDay == null) ctx.warn(name, 'CY Start', 'CY 시작일을 읽지 못해 "CY 미상"으로 분류');
      // 사용자가 추가한 열: 헤더 2행에 글자가 있는데 알려진 열이 아닌 것 → 표 끝에 그대로 표시
      const used = new Set(Object.values(H).filter(c => c >= 0));
      if (cy) { used.add(cy.c); for (let k = 1; k <= 3; k++) if (!isEmpty(at(g, cy.r, cy.c + k))) { used.add(cy.c + k); break; } }
      const extras = [];
      for (let c = 0; c < Math.max(g.rows[h.r].length, (g.rows[h.r + 1] || []).length); c++) {
        if (used.has(c)) continue;
        const lab = [at(g, h.r, c), at(g, h.r + 1, c)].find(v => typeof v === 'string' && v.trim() && norm(v) !== 'contract party');
        if (lab) extras.push({ c, label: lab.trim() });
      }
      if (extras.length) ctx.info(name, extras.map(x => x.label).join(', '), '알 수 없는 열 — 표 끝에 그대로 표시');
      const rows = [];
      for (let r = h.r + 2; r < g.rows.length; r++) {
        const it = readItem(ctx, name, g, r, H);
        it.extra = extras.map(x => strOf(at(g, r, x.c)));
        if (!it.contract && !it.event && !it.items) continue;
        it.dueRule = H.due >= 0 ? strOf(at(g, r, H.due)) : '';
        rows.push(dueActual(ctx, name, g, r, H['due date'], H.actual, it));
      }
      // 편집·저장용: 표 위치(헤더 행, 열 번호, 추가 열, 마지막 데이터 행). 행은 Due Date 순으로 정렬
      const meta = { hr: h.r, cols: { ...H }, extraCols: extras.map(x => x.c), lastRow: rows.length ? Math.max(...rows.map(x => x.r)) : h.r + 1 };
      m.sheets.push({ name, cy: cyDay == null ? 'CY 미상' : 'CY ' + new Date(cyDay * DAY).getUTCFullYear(), rows: sortRows(rows), extras: extras.map(x => x.label), meta });
    }
    // 시트/헤더가 없는 체크리스트도 탭은 남겨 사유를 보여 줌 (CY는 다른 시트 것을 따름)
    const cy0 = (m.sheets.find(x => x.cy) || {}).cy || 'CY 미상'; m.sheets.forEach(x => { if (!x.cy) x.cy = cy0; });

    // 일정 (카고 목록)
    const sc = ctx.sheet('일정', 'schedule');
    if (sc) {
      const h = find(sc, (s, r) => s === 'slot number' && sc.rows[r].some(v => norm(v) === 'lifting slot'), { r1: 20 });
      if (!h) ctx.fail('schedule', '일정', 'Slot Number / Lifting Slot');
      else {
        const row = sc.rows[h.r].map(norm);
        const names = ['lifting slot', 'lifter', 'lifting vol.', 'planned cargo size (mmbtu)', 'actual (cbm)', 'actual (mmbtu)', 'lng ship', 'cargo capacity', 'ship type', 'departing port'];
        const C = {}; names.forEach(n => { C[n] = row.indexOf(n); if (C[n] < 0) ctx.warn('일정', n, '헤더 없음 — "–" 표시'); });
        const asof = findText(sc, 'as of', { r1: h.r });
        m.schedule = { asOf: asof ? asDay(rightValue(sc, asof.r, asof.c)) : null, slots: [] };
        for (let r = h.r + 1; r < sc.rows.length; r++) {
          const slot = at(sc, r, h.c); if (isEmpty(slot)) break;
          const v = n => C[n] >= 0 ? at(sc, r, C[n]) : null;
          const nv = n => C[n] >= 0 ? ctx.num('일정', n, sc, r, C[n]) : null;
          let end = null; for (let c = C['lifting slot'] + 1; c < C['lifting slot'] + 4; c++) { const d = asDay(at(sc, r, c)); if (d != null) { end = d; break; } }
          const start = asDay(v('lifting slot'));
          if (start == null) ctx.warn('일정', 'Lifting Slot', `${addr(r, h.c)} ${slot}: 날짜 없음 — 연도 분류 불가`);
          m.schedule.slots.push({ r, slot: String(slot).trim(), start, end, lifter: strOf(v('lifter')), vol: nv('lifting vol.'), mmbtu: nv('planned cargo size (mmbtu)'),
            actCbm: nv('actual (cbm)'), actMmbtu: nv('actual (mmbtu)'), ship: strOf(v('lng ship')), capacity: nv('cargo capacity'), shipType: strOf(v('ship type')), port: strOf(v('departing port')) });
        }
      }
    }

    // Cargo (카고별 체크리스트: 열 쌍 = Due Date / Actual)
    const cg = ctx.sheet('Cargo', 'cargo');
    if (cg) {
      const lab = findText(cg, 'slot no.', { r1: 30 });
      const h = findText(cg, 'contract', { r1: 30 });
      const dueRow = lab ? find(cg, (s, r, c) => c === lab.c && s === 'due', { r0: lab.r + 1, r1: lab.r + 10 }) : null;
      if (!lab || !h || !dueRow) ctx.fail('cargo', 'Cargo', !lab ? 'Slot No.' : !h ? 'Contract' : 'Due');
      else {
        const H = headerCols(cg, Array.from({ length: dueRow.r - h.r + 1 }, (_, k) => h.r + k), ['contract', 'clauses', 'from', 'to', 'event', 'items covered']);
        const items = [];
        for (let r = dueRow.r + 1; r < cg.rows.length; r++) {
          const it = readItem(ctx, 'Cargo', cg, r, H);
          if (!it.contract && !it.event && !it.items) continue;
          it.dueRule = strOf(at(cg, r, lab.c));
          items.push(it);
        }
        const pairs = [], width = Math.max(...cg.rows.map(x => x.length));
        for (let c = lab.c + 1; c < width; c++) {
          const slot = at(cg, lab.r, c);
          if (isEmpty(slot) && norm(at(cg, dueRow.r, c)) !== 'due date') continue;
          if (norm(at(cg, dueRow.r, c)) !== 'due date' || norm(at(cg, dueRow.r, c + 1)) !== 'actual')
            ctx.warn('Cargo', addr(dueRow.r, c), '열 쌍 헤더가 "Due Date / Actual"이 아님 — 그대로 읽음');
          pairs.push({ slot: strOf(slot), c, rows: items.map(it => dueActual(ctx, 'Cargo', cg, it.r, c, c + 1, { ...it, r: it.r })) });
          c++;
        }
        m.cargo = { pairs, itemCount: items.length };
      }
    }

    // History (연단위) — 시트를 그대로 표로
    const hs = ctx.sheet('History (연단위)', 'history');
    if (hs) {
      hs.rows.forEach((row, r) => row.forEach((v, c) => { if (isErr(v)) ctx.warn('History (연단위)', addr(r, c), `${v.code} — "–" 처리`); }));
      m.history = hs;
    }
    ctx.flush();
    return m;
  }

  function detect(wb){
    const n = wb.SheetNames;
    const hit = list => list.filter(x => n.includes(x)).length;
    if (hit(['Operation Daily', 'Feed Gas', 'ADP 및 SDS', 'Ledger_ADP 및 SDS']) >= 2) return 'ledger';
    if (hit(['ADP Process', 'Annual', 'Monthly', 'Cargo', '일정']) >= 3) return 'check';
    return null;
  }
  // pastCargo: Lifting 창이 기준일 전에 끝난 카고 → 지난 마감 + Actual 공란 = 실적 미입력 (지연 아님)
  function status(it, ref, pastCargo){
    if (it.actualDay != null || it.actualText) return { k: 'done', label: '완료' };
    if (it.dueDay != null) {
      const diff = it.dueDay - ref;
      if (diff < 0 && pastCargo) return { k: 'miss', label: '실적 미입력', diff };
      if (diff < 0) return { k: 'late', label: '지연', diff };
      if (diff <= 7) return { k: 'd7', label: 'D-7 임박', diff };
      if (diff <= 30) return { k: 'd30', label: 'D-30', diff };
      return { k: 'plan', label: '예정', diff };
    }
    return { k: 'rule', label: '수시/규칙' };
  }
  // ---------- 시트 매칭: 파일 단위가 아니라 시트 단위 ----------
  const GROUPS = { ledger: ['Feed Gas', 'Forecast', 'Ledger_ADP 및 SDS', 'Condensate Ledger', 'ADP 및 SDS', 'LP', 'Operation Daily', 'BrentnJKM'],
    check: ['ADP Process', 'Annual', 'Monthly', '일정', 'Cargo', 'History (연단위)'] };
  // 헤더 지문: 각 파서가 찾는 대표 헤더가 시트 위쪽(45행·60열 안)에 있는지
  function sheetFP(ws){
    if (!ws || !ws['!ref']) return [];
    const R = XLSX.utils.decode_range(ws['!ref']), rows = [];
    for (let r = 0; r <= Math.min(R.e.r, 45); r++) { const row = []; for (let c = 0; c <= Math.min(R.e.c, 60); c++) { const v = cellValue(ws[XLSX.utils.encode_cell({ r, c })]); if (typeof v === 'string' && v.trim()) row.push(norm(v)); } rows.push(row); }
    const all = new Set(rows.flat()), has = (...t) => t.every(x => all.has(x)), sameRow = (...t) => rows.some(r => t.every(x => r.includes(x)));
    const out = [], led = sameRow('date', 'production', 'inventory') && has('working capacity');
    if (has('nomination', 'actual', 'mmscf')) out.push('Feed Gas');
    if (sameRow('date', 'feed gas', 'lng', 'condensate')) out.push('Forecast');
    if (led && has('cbm')) out.push('Ledger_ADP 및 SDS');
    if (led && has('bbl')) out.push('Condensate Ledger');
    if (sameRow('slot number', 'lifting slot', 'cargo size (planned_cbm)')) out.push('ADP 및 SDS');
    if (sameRow('slot number', 'lifting slot', 'cargo size (planned_bbl)')) out.push('LP');
    if (has('barossa & dlng production', 'actual vs plan')) out.push('Operation Daily');
    if (sameRow('날짜', 'brent가격')) out.push('BrentnJKM');
    if (has('contract', 'cy start', 'event', 'items covered')) out.push('ADP Process', 'Annual', 'Monthly');
    if (sameRow('slot number', 'lifting slot', 'lifting vol.', 'lng ship')) out.push('일정');
    if (has('slot no.', 'lifting slot', 'lng ship', 'due date', 'actual')) out.push('Cargo');
    if (has('cargo no.') && (has('annual (avg)') || has('spec'))) out.push('History (연단위)');
    return out;
  }
  // 이름 비슷한 정도: 같음 3 / 포함 2 / 낱말 겹침 1 / 없음 0
  function simScore(a, b){
    const n = s => s.toLowerCase().replace(/[^a-z0-9가-힣]/g, ''), x = n(a), y = n(b);
    if (!x || !y) return 0; if (x === y) return 3; if (x.includes(y) || y.includes(x)) return 2;
    const tok = s => new Set(s.toLowerCase().split(/[^a-z0-9가-힣]+/).filter(Boolean)), ta = tok(a), tb = tok(b);
    return [...ta].some(t => tb.has(t)) ? 1 : 0;
  }
  // files: 불러온 순서대로 [{id, name, wb}]. 순서: 수동 선택 → 이름 그대로(나중 파일 우선) → 헤더 지문(모호하면 고르지 않음)
  function resolveSheets(files, manual = {}){
    const all = []; files.forEach((f, order) => f.wb.SheetNames.forEach(sheet => all.push({ f, order, sheet, key: f.id + '|' + sheet })));
    const cache = new Map(), fp = s => { if (!cache.has(s.key)) cache.set(s.key, sheetFP(s.f.wb.Sheets[s.sheet])); return cache.get(s.key); };
    const LOG = [...GROUPS.ledger, ...GROUPS.check], res = {}, claimed = new Set(), label = s => `${s.f.name} › ${s.sheet}`;
    LOG.forEach(L => { const s = manual[L] && all.find(x => x.key === manual[L]); if (s && !claimed.has(s.key)) { res[L] = { s, how: '수동', dup: [] }; claimed.add(s.key); } });
    LOG.forEach(L => {
      if (res[L]) return;
      const c = all.filter(x => x.sheet.trim() === L && !claimed.has(x.key)).sort((a, b) => b.order - a.order);
      if (c.length) { res[L] = { s: c[0], how: '이름', dup: c.slice(1).map(label) }; c.forEach(x => claimed.add(x.key)); }
    });
    LOG.forEach(L => {
      if (res[L]) return;
      const c = all.filter(x => !claimed.has(x.key) && fp(x).includes(L)).map(x => ({ x, sc: simScore(x.sheet, L) })).sort((a, b) => b.sc - a.sc || b.x.order - a.x.order);
      if (!c.length) { res[L] = { status: 'none', cands: [] }; return; }
      const top = c[0], rival = c.find(y => y !== top && y.sc === top.sc && y.x.sheet !== top.x.sheet);
      // 이름 단서가 없고 같은 지문을 쓰는 다른 미해결 시트가 있으면 추측하지 않음
      const shared = top.sc === 0 && LOG.some(K => K !== L && !res[K] && fp(top.x).includes(K));
      if (rival || shared) { res[L] = { status: 'ambiguous', cands: c.map(y => label(y.x)) }; return; }
      const dup = c.filter(y => y !== top && y.x.sheet === top.x.sheet);
      res[L] = { s: top.x, how: '헤더', dup: dup.map(y => label(y.x)) }; claimed.add(top.x.key); dup.forEach(y => claimed.add(y.x.key));
    });
    LOG.forEach(L => { const r = res[L]; if (r.s) { r.status = r.dup.length ? 'dup' : 'ok'; r.file = r.s.f; r.sheet = r.s.sheet; r.key = r.s.key; delete r.s; } });
    return res;
  }
  // Due Date 오름차순, 날짜 없는 행은 원래 순서 그대로 맨 뒤 (안정 정렬)
  function sortRows(rows){ return rows.filter(x => x.dueDay != null).sort((a, b) => a.dueDay - b.dueDay).concat(rows.filter(x => x.dueDay == null)); }
  return { parseLedger, parseCheck, detect, status, sortRows, GROUPS, sheetFP, resolveSheets, asDay, iso, todayDay, isErr, isNum, isEmpty, norm, DAY };
})();
if (typeof module !== 'undefined') module.exports = M;
</script>

<script>

// ---------- 탭 (키보드 이동) ----------
function tabBar(cls, items, active, attr){
  return `<div class="tabs ${cls} no-print" role="tablist">${items.map(([id, label]) =>
    `<button class="tab" role="tab" type="button" data-${attr}="${esc(id)}" aria-selected="${id === active}" tabindex="${id === active ? 0 : -1}">${esc(label)}</button>`).join('')}</div>`;
}
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('tab')) return;
  const list = [...t.parentElement.querySelectorAll('.tab')], i = list.indexOf(t);
  const j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: list.length - 1 }[e.key];
