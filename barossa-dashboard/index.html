// ---------- 차트 (SVG) ----------
// o: {label, series:[{label,color,pts:[{d,v}],split,area}], boundary, refDay, unit, dec, tight, h,
//     refs:[{key,label,v}], markers:[{d,text}], flags:[{d0,d1,text}], direct}
const charts = [];
const REF_DASH = { 'working capacity': '', 'tank top': '4 3', 'unpumpable': '1 3' };
const HALO = 'stroke="var(--card)" stroke-width="3" paint-order="stroke"';
function lineChart(o){
  const series = o.series.map(sr => ({ ...sr, pts: sr.pts.filter(p => M.isNum(p.v)) })).filter(sr => sr.pts.length);
  if (!series.length) return `<div class="placeholder">데이터 없음</div>`;
  const all = series.flatMap(sr => sr.pts), refs = o.refs || [];
  const W = 400, H = o.h || 170, L = 40, R = 10, T = 12, B = o.markers ? 34 : 22, PB = H - B;
  const d0 = Math.min(...all.map(p => p.d)), d1 = Math.max(...all.map(p => p.d), d0 + 1);
  const vs = all.map(p => p.v).concat(refs.map(r => r.v));
  let lo = Math.min(0, ...vs), hi = Math.max(...vs);
  if (o.tight) { lo = Math.min(...vs); const pad = (hi - lo) * .1 || 1; lo -= pad; hi += pad; }
  if (hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = d => L + (d - d0) / (d1 - d0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (PB - T);
  const bnd = o.boundary ?? Infinity;
  const path = arr => arr.map((p, k) => `${k ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  (o.flags || []).forEach(f => { const a = Math.max(f.d0, d0), b = Math.min(f.d1, d1); if (a <= b) s += `<rect x="${x(a) - 1}" y="${T}" width="${Math.max(2, x(b) - x(a) + 2)}" height="${PB - T}" fill="var(--m-late)" opacity=".1"/>`; });
  for (let v = lo; v <= hi + step / 2; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(shortNum(v))}</text>`;
  const ticks = 5; for (let k = 0; k <= ticks; k++) { const d = Math.round(d0 + (d1 - d0) * k / ticks); s += `<text x="${x(d)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === ticks ? 'end' : 'middle'}" font-size="10" fill="var(--muted)">${M.iso(d).slice(5)}</text>`; }
  refs.forEach(r => { s += `<line x1="${L}" x2="${W - R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="var(--text2)" stroke-width="1"${REF_DASH[r.key] ? ` stroke-dasharray="${REF_DASH[r.key]}"` : ''} opacity=".8"/>`; });
  series.forEach(sr => {
    const act = sr.split ? sr.pts.filter(p => p.d <= bnd) : sr.pts, fc = sr.split ? sr.pts.filter(p => p.d > bnd) : [];
    if (sr.area && act.length) s += `<path d="${path(act)}L${x(act[act.length - 1].d)},${y(Math.max(lo, 0))}L${x(act[0].d)},${y(Math.max(lo, 0))}Z" fill="${sr.color}" opacity=".1"/>`;
    if (act.length) s += `<path d="${path(act)}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (fc.length) s += `<path d="${path(act.length ? [act[act.length - 1], ...fc] : fc)}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-dasharray="5 4"/>`;
  });
  // 기준선 라벨: 11px 안쪽으로 붙은 선은 한 줄로 묶음 (오른쪽 끝, 배경 halo)
  const groups = [];
  [...refs].sort((a, b) => b.v - a.v).forEach(r => { const g = groups[groups.length - 1], nm = r.label.replace(/ \(.*\)$/, ''); if (g && y(r.v) - y(g.v) < 11) g.names.push(nm); else groups.push({ v: r.v, names: [nm] }); });
  groups.forEach(g => { s += `<text x="${W - R - 2}" y="${y(g.v) - 3}" text-anchor="end" font-size="9.5" fill="var(--text2)" ${HALO}>${esc(g.names.join(' · '))}</text>`; });
  if (o.refDay != null && o.refDay >= d0 && o.refDay <= d1) s += `<line x1="${x(o.refDay)}" x2="${x(o.refDay)}" y1="${T}" y2="${PB}" stroke="var(--text2)" stroke-width="1"/><text x="${x(o.refDay) + 3}" y="${refs.length ? PB - 4 : T + 9}" font-size="10" fill="var(--text2)" ${HALO}>기준일</text>`;
  const lastAct = sr => { const a = sr.pts.filter(p => !sr.split || p.d <= bnd); return a[a.length - 1]; };
  if (o.direct) {
    const labs = series.map(sr => ({ sr, p: lastAct(sr) })).filter(l => l.p).map(l => ({ ...l, y: y(l.p.v) })).sort((a, b) => a.y - b.y);
    labs.forEach((l, k) => { let ty = l.y - 7; if (k && ty - labs[k - 1].ty < 11) ty = l.y + 14; l.ty = ty;
      s += `<circle cx="${x(l.p.d)}" cy="${l.y}" r="4" fill="${l.sr.color}" stroke="var(--card)" stroke-width="2"/><text x="${x(l.p.d) - 7}" y="${ty}" text-anchor="end" font-size="10" font-weight="700" fill="var(--text)" ${HALO}>${esc(l.sr.label)} ${fmt(l.p.v, o.dec ?? 0)}</text>`; });
  } else { const p = lastAct(series[0]); if (p) s += `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="4" fill="${series[0].color}" stroke="var(--card)" stroke-width="2"/><text x="${Math.min(x(p.d), W - R - 40)}" y="${y(p.v) - 9}" font-size="10" font-weight="700" fill="var(--text2)" ${HALO}>Latest</text>`; }
  const mk = (o.markers || []).filter(m => m.d >= d0 && m.d <= d1);
  mk.forEach(m => { const mx = x(m.d); s += `<line x1="${mx}" x2="${mx}" y1="${PB - 6}" y2="${PB}" stroke="var(--text2)"/><path d="M${mx},${PB + 3}L${mx + 4.5},${PB + 11}L${mx - 4.5},${PB + 11}Z" fill="var(--text2)" stroke="var(--card)" stroke-width="2" paint-order="stroke"/>`; });
  s += `<line class="guide" x1="0" x2="0" y1="${T}" y2="${PB}" stroke="var(--axis)" visibility="hidden"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T}" fill="transparent"/></svg>`;
  const dates = [...new Set(all.map(p => p.d))].sort((a, b) => a - b);
  const id = charts.length;
  charts.push({ dates, x, W, L, R, d0, d1, bnd, unit: o.unit, dec: o.dec ?? 0, flags: o.flags || [],
    series: series.map(sr => ({ label: sr.label, color: sr.color, split: sr.split, map: new Map(sr.pts.map(p => [p.d, p.v])) })),
    markers: mk.reduce((a, m) => (a[m.d] = (a[m.d] || []).concat(m.text), a), {}) });
  return `<div class="chartbox" data-chart="${id}">${s}</div>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function shortNum(v){ const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : String(Math.round(v * 100) / 100); }
// 툴팁: 워크북 문자열은 textContent로만 넣음
function tipRow(tip, val, label, color, dash){
  const r = document.createElement('div'); r.className = 'tr';
  if (color) { const k = document.createElement('span'); k.className = 'k'; k.style.borderTopColor = color; if (dash) k.style.borderTopStyle = 'dashed'; r.append(k); }
  const b = document.createElement('b'); b.textContent = val; const t = document.createElement('span'); t.textContent = label; r.append(b, t); tip.append(r);
}
function placeTip(e){ const tip = $('#tip'); tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = Math.max(4, e.clientY - tip.offsetHeight - 10) + 'px'; }
const timelines = [];
document.addEventListener('pointermove', e => {
  const tip = $('#tip'), box = e.target.closest && e.target.closest('[data-chart]'), tl = e.target.closest && e.target.closest('[data-tl]');
  document.querySelectorAll('.chartbox .guide').forEach(g => { if (!box || !box.contains(g)) g.setAttribute('visibility', 'hidden'); });
  if (tl) {
    const [ti, k] = tl.dataset.tl.split(':').map(Number), x = timelines[ti][k];
    tip.replaceChildren(); const hd = document.createElement('div'); hd.className = 'hd'; hd.textContent = x.when; tip.append(hd);
    tipRow(tip, x.st.label, x.it.event || '–'); placeTip(e); return;
  }
  if (!box) { tip.style.display = 'none'; return; }
  const c = charts[+box.dataset.chart], svg = box.querySelector('svg'), rc = svg.getBoundingClientRect();
  const px = (e.clientX - rc.left) / rc.width * c.W;
  const dd = c.d0 + (px - c.L) / (c.W - c.L - c.R) * (c.d1 - c.d0);
  let d = c.dates[0]; for (const v of c.dates) if (Math.abs(v - dd) < Math.abs(d - dd)) d = v;
  const g = svg.querySelector('.guide'), gx = c.x(d); g.setAttribute('x1', gx); g.setAttribute('x2', gx); g.setAttribute('visibility', 'visible');
  tip.replaceChildren(); const hd = document.createElement('div'); hd.className = 'hd';
  hd.textContent = M.iso(d) + (c.bnd === Infinity ? '' : d > c.bnd ? ' · 예측' : ' · 실적'); tip.append(hd);
  c.series.forEach(sr => { const v = sr.map.get(d); if (M.isNum(v)) tipRow(tip, `${fmt(v, c.dec)} ${c.unit}`, sr.label, sr.color, sr.split && d > c.bnd); });
  (c.markers[d] || []).forEach(t => tipRow(tip, '▲ Lifting', t));
  c.flags.filter(f => d >= f.d0 && d <= f.d1).forEach(f => tipRow(tip, '⚠', f.text));
  placeTip(e);
});

// ---------- Tab 1: Production Overview ----------
function renderProd(){
  const m = S.ledger?.model;
  if (!m) return `<div class="placeholder">이 탭은 <b>Ledger 워크북</b>을 불러오면 표시됩니다.</div>`;
  const B = m.lastActual ?? S.ref - 1;
  const byDay = (arr, d) => arr.find(x => x.d === d);
  const fgB = byDay(m.feedGas, B), lB = byDay(m.lng, B), cB = byDay(m.cond, B);
  const nextL = m.lngLift.slots.find(s => s.start >= S.ref), nextC = m.condLift.slots.find(s => s.start != null && s.start >= S.ref);
  const condVol = s => s ? s.parts.reduce((a, p) => a + (p.plan || 0), 0) : null;
  const kpi = (l, v, unit, sub) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}<small>${unit}</small></div><div class="s">${sub || ''}</div></div>`;

  const end = Math.max(B, S.ref) + 30;
  const win = (arr, key) => arr.filter(x => x.d > B - 30 && x.d <= end).map(x => ({ d: x.d, v: x[key] }));
  const fgPts = [...m.feedGas.filter(x => x.d > B - 30 && x.d <= B && x.v != null), ...m.fgForecast.filter(x => x.d > B && x.d <= end)];
  const nomPts = m.feedGas.filter(x => x.d > B - 30 && x.d <= B).map(x => ({ d: x.d, v: x.n }));
  const one = (label, pts, unit, extra = {}) => lineChart({ label, unit, boundary: B, refDay: S.ref, series: [{ label, color: 'var(--series)', pts, split: true, area: extra.area }], ...extra });
  const key = (cls, txt, color) => `<span><i class="${cls}" style="color:${color || 'var(--series)'}"></i>${txt}</span>`;
  const legend = `<div class="chart-legend">${key('', '실적')}${key('dash', '예측')}<span>● Latest = 최신 실적일 ${M.iso(B)}</span></div>`;
  const fgChart = lineChart({ label: 'Feed Gas', unit: 'mmscf', dec: 1, boundary: B, refDay: S.ref, direct: true, series: [
    { label: 'Actual', color: 'var(--series)', pts: fgPts, split: true },
    { label: 'Nomination', color: 'var(--context)', pts: nomPts, split: false }] });
  const fgLegend = `<div class="chart-legend">${key('', 'Actual (Gas Export)')}${key('', 'Nomination', 'var(--context)')}${key('dash', '예측 (Forecast 시트)')}</div>`;
  // 재고: 기준선 + Lifting 표식 + 예측 경고 구간
  const lngMk = m.lngLift.slots.map(s => ({ d: s.start, text: `${s.slot} · ${M.isEmpty(s.lifter) ? '–' : s.lifter} · ${fmt(s.plan)} cbm` }));
  const condMk = m.condLift.slots.filter(s => s.start != null).map(s => ({ d: s.start, text: `${s.slot} · ${s.parts.map(p => p.lifter).filter(Boolean).join('/') || '–'} · ${fmt(s.parts.reduce((a, p) => a + (p.plan || 0), 0))} bbl` }));
  const invNote = (refs, flags, unit) => {
    const dash = { 'working capacity': 'thin', 'tank top': 'thin dash', 'unpumpable': 'thin dot' };
    const inWin = flags.filter(f => f.d1 > B - 30 && f.d0 <= end), more = flags.length - inWin.length;
    const byText = {}; inWin.forEach(f => (byText[f.text] = byText[f.text] || []).push(f.d0 === f.d1 ? M.iso(f.d0).slice(5) : `${M.iso(f.d0).slice(5)}~${M.iso(f.d1).slice(5)}`));
    return `<div class="chart-legend">${key('', '실적')}${key('dash', '예측')}<span><span class="tri"></span>Lifting</span>${
      refs.map(r => `<span><i class="${dash[r.key]}" style="color:var(--text2)"></i>${esc(r.label)} ${fmt(r.v)}</span>`).join('')}</div>${
      Object.entries(byText).map(([t, ds]) => `<p class="chart-flag">⚠ ${esc(t)} (${ds.length}구간): ${ds.join(', ')} — 선은 자르지 않음</p>`).join('')}${
      more > 0 ? `<p class="note">그래프 범위 밖 경고 구간 ${more}개 — 데이터 점검 참고</p>` : ''}`;
  };
  const inv = (label, rows, refs, mk, flags, unit) => `<h3>${label}</h3>${one(label, win(rows, 'i'), unit, { area: true, refs, markers: mk, flags })}${invNote(refs, flags, unit)}`;

  const lngRows = m.lngLift.slots.filter(s => s.start >= S.ref);
  const condRows = m.condLift.slots.filter(s => s.start != null && s.start >= S.ref);
  const iss = m.lngLift.issue;
  const in90 = iss != null ? m.lngLift.slots.filter(s => s.start >= iss && s.start <= iss + 90).length : null;

  const prod = m.prod;
  // 달성률 막대: 0 ~ max(120%, 표 안 최댓값), 100% 눈금. 값이 커도 자르지 않음
  const pctMax = prod ? Math.max(1.2, ...prod.rows.flatMap(r => r.vals.slice(5)).filter(M.isNum)) : 1.2;
  const pctCell = v => M.isNum(v) ? td(`<span class="ach"><span class="bar" aria-hidden="true"><i style="width:${Math.max(0, v) / pctMax * 100}%"></i><b style="left:${100 / pctMax}%"></b></span>${fmt(v * 100, 1)}%</span>`, v, true) : `<td class="num" data-v="">–</td>`;
  const prodTable = !prod ? errBox(m.err.prod || 'Operation Daily 표를 읽지 못했습니다') :
    `<div class="tw"><table class="t-prod" data-sheet="생산 실적 vs 계획"><thead><tr><th>구분</th><th></th><th class="num">Day (${M.iso(prod.day)})</th><th class="num">MTD 실적</th><th class="num">YTD 실적</th><th class="num">MTD 계획</th><th class="num">YTD 계획</th><th class="num">MTD 달성률</th><th class="num">YTD 달성률</th></tr></thead><tbody>${
      prod.rows.map((r, k) => { const dec = /lng|condensate/i.test(r.group) ? 2 : 1; return `<tr>${tdTxt(k && prod.rows[k - 1].group === r.group ? '' : r.group)}${tdTxt(r.sub)}${r.vals.slice(0, 5).map(v => tdNum(v, dec)).join('')}${r.vals.slice(5).map(pctCell).join('')}</tr>`; }).join('')
    }</tbody></table></div><p class="note">계획 기준: ${esc(prod.planLabel)} · 달성률 = 실적 ÷ 계획</p>`;

  const p = m.price, lastP = key => [...p.daily].reverse().find(x => M.isNum(x[key]));
  const priceKpi = (key, name, unit, color) => { const l = lastP(key); const i = l ? p.daily.indexOf(l) : -1; const prev = i > 0 ? p.daily.slice(0, i).reverse().find(x => M.isNum(x[key])) : null;
    const ch = l && prev ? l[key] - prev[key] : null;
    return `<div><div class="kpi"><div class="l">${name} 최근값 (${l ? M.iso(l.d) : '–'})</div><div class="v">${fmt(l?.[key], 2)}<small>${unit}</small></div><div class="s">전일 대비 ${ch == null ? '–' : (ch >= 0 ? '+' : '') + fmt(ch, 2)}</div></div>${lineChart({ label: name, unit, tight: true, dec: 2, h: 150, series: [{ label: name, color, pts: p.daily.map(x => ({ d: x.d, v: x[key] })) }] })}</div>`; };

  return `${insightBar()}
  <section class="card"><h2>Project Status <span class="muted" style="font-size:12px;font-weight:600">· 최신 보고일 ${M.iso(B)} 실적</span></h2>
    <div class="kpis">
      ${kpi('Feed Gas Export', fmt(fgB?.v, 1), 'mmscf', '일 실적')}
      ${kpi('LNG 생산', fmt(lB?.p, 0), 'cbm', `재고 ${fmt(lB?.i, 0)} cbm`)}
      ${kpi('Condensate 생산', fmt(cB?.p, 0), 'bbl', `재고 ${fmt(cB?.i, 0)} bbl`)}
      ${kpi('다음 LNG Lifting', nextL ? M.iso(nextL.start) : '–', '', nextL ? `${dday(nextL.start - S.ref)} · ${esc(nextL.lifter ?? '–')} · ${fmt(nextL.plan)} cbm` : '기준일 이후 슬롯 없음')}
      ${kpi('다음 Condensate Lifting', nextC ? M.iso(nextC.start) : '–', '', nextC ? `${dday(nextC.start - S.ref)} · ${esc(nextC.parts.map(x => x.lifter).filter(Boolean).join('/'))} · ${fmt(condVol(nextC))} bbl` : '기준일 이후 슬롯 없음')}
    </div>
  </section>
  <section><h2>Production 그래프 <span class="muted" style="font-size:12px;font-weight:600">· 최근 실적 30일 + 예측 (기준일+30일까지)</span></h2>
    <div class="grid g3">
      <div class="card"><h3>Feed Gas — Nomination vs Actual (mmscf)</h3>${m.err.fg ? errBox(m.err.fg) : fgChart + fgLegend}${m.err.fc ? `<p class="chart-flag">⚠ 예측 꼬리 없음: ${esc(m.err.fc)}</p>` : ''}</div>
      <div class="card"><h3>LNG 생산 (cbm)</h3>${m.err.lng ? errBox(m.err.lng) : one('LNG 생산', win(m.lng, 'p'), 'cbm') + legend + inv('LNG 재고 (cbm)', m.lng, m.lngRef || [], lngMk, m.lngFlags || [], 'cbm')}</div>
      <div class="card"><h3>Condensate 생산 (bbl)</h3>${m.err.cond ? errBox(m.err.cond) : one('Condensate 생산', win(m.cond, 'p'), 'bbl') + legend + inv('Condensate 재고 (bbl)', m.cond, m.condRef || [], condMk, m.condFlags || [], 'bbl')}</div>
    </div>
  </section>
  <section class="grid g2 lift">
    <div class="card"><h2>LNG Lifting 일정 (향후)</h2>
      ${m.err.lngLift ? "" : `<p class="note" style="margin:0 0 8px">ADP Issue ${M.iso(iss)} · SDS 90일 창 ${iss != null ? M.iso(iss) + ' ~ ' + M.iso(iss + 90) + ` (슬롯 ${in90}개)` : '–'} · 마지막 SDS 확정 슬롯 ${esc((m.lngLift.lastSds || '–').toUpperCase())}</p>`}
      ${m.err.lngLift ? errBox(m.err.lngLift) : lngRows.length ? `<div class="tw"><table class="t-lng" data-sheet="LNG Lifting"><thead><tr><th>Slot</th><th>Lifting Slot</th><th>D-day</th><th>Lifter</th><th class="num">Planned (cbm)</th><th class="num">Actual (cbm)</th><th>Proposed Vessel</th><th>상태</th></tr></thead><tbody>${
        lngRows.map(s => `<tr class="${s.sds ? 'sds' : ''}">${tdTxt(s.slot)}${td(M.iso(s.start) + (s.end != null ? ' ~ ' + M.iso(s.end).slice(5) : ''), M.iso(s.start))}${tdTxt(dday(s.start - S.ref))}${td(lifterPill(s.lifter), s.lifter)}${tdNum(s.plan)}${tdNum(s.act)}${tdTxt(s.vessel)}${td(s.sds ? '<span class="pill st-d30">SDS 확정</span>' : '<span class="pill st-plan">ADP</span>', s.sds ? 'SDS 확정' : 'ADP')}</tr>`).join('')
      }</tbody></table></div>` : `<div class="placeholder">기준일 이후 LNG 슬롯이 없습니다.</div>`}
    </div>
    <div class="card"><h2>Condensate Lifting 일정 (향후)</h2>
      ${m.err.condLift ? "" : `<p class="note" style="margin:0 0 8px">LP Issue ${M.iso(m.condLift.issue)}</p>`}
      ${m.err.condLift ? errBox(m.err.condLift) : condRows.length ? `<div class="tw"><table class="t-cond" data-sheet="Condensate Lifting"><thead><tr><th>Slot</th><th>Lifting Slot</th><th>D-day</th><th>Lifter</th><th class="num">Planned (bbl)</th><th class="num">Actual (bbl)</th><th>Proposed Vessel</th></tr></thead><tbody>${
        condRows.map(s => s.parts.map((pt, k) => `<tr>${k ? '<td data-v=""></td><td data-v=""></td><td data-v=""></td>' : tdTxt(s.slot) + td(M.iso(s.start) + (s.end != null ? ' ~ ' + M.iso(s.end).slice(5) : ''), M.iso(s.start)) + tdTxt(dday(s.start - S.ref))}${td(lifterPill(pt.lifter), pt.lifter)}${tdNum(pt.plan)}${tdNum(pt.act)}${k ? '<td data-v=""></td>' : tdTxt(s.vessel)}</tr>`).join('')).join('')
      }</tbody></table></div>` : `<div class="placeholder">기준일 이후 Condensate 슬롯이 없습니다.</div>`}
    </div>
  </section>
  <section class="card"><h2>생산 실적 vs 계획</h2>${prodTable}</section>
  <section class="card"><h2>Brent · JKM</h2>${m.err.price ? errBox(m.err.price) : ''}
    <div class="grid g2">${priceKpi('b', 'Brent', 'US$/bbl', 'var(--series)')}${priceKpi('j', 'JKM', '$/MMBtu', 'var(--series)')}</div>
    ${p.monthly.length ? `<div class="tw" style="margin-top:10px"><table class="t-mon" data-sheet="Brent JKM 월평균"><thead><tr><th>월</th><th class="num">Brent 월평균 (US$/bbl)</th><th class="num">JKM 월평균 ($/MMBtu)</th></tr></thead><tbody>${
      p.monthly.map(x => `<tr>${td(M.iso(x.d).slice(0, 7), M.iso(x.d).slice(0, 7))}${tdNum(x.b, 2)}${tdNum(x.j, 2)}</tr>`).join('')}</tbody></table></div>` : ''}
  </section>`;
}

// ---------- 체크리스트 표 공통 ----------
const dlab = v => v === 0 ? 'D' : v < 0 ? `D${v}` : `D+${v}`;
// 미입력 표시: 빨간 글자 + ⊘ 아이콘 + 글자 (지연 ▲와 구분)
const MISS = lab => `<span class="miss-in">⊘ ${lab}</span>`;
const gotoBtn = (key, it, html) => `<button type="button" class="goto" data-goto="${esc(key + '|' + it.r)}">${html}</button>`;
const shortTxt = (s, n = 16) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
// 글자 폭 추정 (한글은 넓게)
const textW = (s, fs = 10.5) => [...String(s)].reduce((w, ch) => w + (/[ㄱ-힝]/.test(ch) ? fs : fs * .58), 0);
const STATUS_ORDER = [['done', '완료'], ['late', '지연'], ['d7', 'D-7 임박'], ['d30', 'D-30'], ['plan', '예정'], ['miss', '실적 미입력'], ['rule', '날짜 없음']];
// 카고 진행 요약: 상태별 칸 막대 + 개수 + 완료/전체
function progressBar(list){
  const c = {}; list.forEach(x => c[x.st.k] = (c[x.st.k] || 0) + 1);
  const items = STATUS_ORDER.filter(([k]) => c[k]);
  return `<div class="prog"><div class="prog-h"><b>완료 ${c.done || 0} / 전체 ${list.length}</b></div>
    <div class="pbar" role="img" aria-label="${esc(items.map(([k, l]) => `${l} ${c[k]}건`).join(', '))}">${items.map(([k, l]) => `<span class="pseg ps-${k}" style="flex:${c[k]} 1 0" title="${l} ${c[k]}건"></span>`).join('')}</div>
    <div class="plegend">${items.map(([k, l]) => `<span>${sico(k)}${l} <b>${c[k]}</b></span>`).join('')}</div></div>`;
}
// 바로 앞 과제: 지연이 있으면 가장 오래 지연된 것, 없으면 기준일 이후 가장 이른 열린 과제
function nextTask(list, key){
  const asc = (a, b) => a.it.dueDay - b.it.dueDay;
  const late = list.filter(x => x.st.k === 'late').sort(asc), fut = list.filter(x => ['d7', 'd30', 'plan'].includes(x.st.k)).sort(asc), miss = list.filter(x => x.st.k === 'miss').sort(asc);
  const pick = late[0] || fut[0];
  if (pick) {
    const { it, st } = pick, who = [it.from, it.to].filter(Boolean).join(' → ');
    return `<p class="nexttask">바로 앞 과제: ${gotoBtn(key, it, `${statusPill(st)} <b>${it.event ? esc(it.event) : MISS('Event 미입력')}</b> · ${M.iso(it.dueDay)} (${dday(st.diff)}${st.k === 'late' ? ' 지연' : ''})${who ? ' · ' + esc(who) : ''}`)}${late.length > 1 ? ` <span class="muted">· 그 밖에 지연 ${late.length - 1}건</span>` : ''}</p>`;
  }
  if (miss.length) return `<p class="nexttask">바로 앞 과제: 열린 과제 없음 · ${MISS('실적 미입력')} ${miss.length}건 — 가장 오래된 항목 ${gotoBtn(key, miss[0].it, `<b>${esc(miss[0].it.event || '–')}</b> (${M.iso(miss[0].it.dueDay)})`)}</p>`;
  return `<p class="nexttask">바로 앞 과제: 열린 과제 없음</p>`;
}
// 마감 타임라인: 체크리스트 = 날짜축, 카고 = Lifting 시작일 기준 D-day 축.
// 기준일은 항상 축 위에 둠 — 너무 멀면 축을 끊고(≈) 짧은 구간을 덧붙임
function timeline(list, opt, key){
  const dated = list.filter(x => x.it.dueDay != null), undated = list.filter(x => x.it.dueDay == null);
  const ti = timelines.length, reg = []; timelines.push(reg);
  let svg = '';
  if (dated.length) {
    const rel = opt.anchor != null, val = x => rel ? x.it.dueDay - opt.anchor : x.it.dueDay, refV = rel ? S.ref - opt.anchor : S.ref;
    let v0 = Math.min(...dated.map(val)), v1 = Math.max(...dated.map(val));
    if (rel) { v0 = Math.min(v0, -30); v1 = Math.max(v1, 0); }
    const W = Math.min(1100, Math.max(330, ($('#app')?.clientWidth || 800) - 60)), L = 12, R = 12, BRK = 16, far = Math.max(25, (v1 - v0) * .35);
    let segs;
    if (refV > v1 + far) segs = [{ a: v0, b: v1, w: .82 }, { a: refV - 3, b: refV + 3, w: .18 }];
    else if (refV < v0 - far) segs = [{ a: refV - 3, b: refV + 3, w: .18 }, { a: v0, b: v1, w: .82 }];
    else segs = [{ a: Math.min(v0, refV), b: Math.max(v1, refV), w: 1 }];
    segs.forEach(s => { const p = Math.max(1.5, (s.b - s.a) * .03); s.a -= p; s.b += p; });
    const usable = W - L - R - (segs.length - 1) * BRK; let acc = L;
    segs.forEach(s => { s.x0 = acc; s.x1 = acc + usable * s.w; acc = s.x1 + BRK; });
    const x = v => { const s = segs.find(g => v >= g.a && v <= g.b) || (v < segs[0].a ? segs[0] : segs[segs.length - 1]); return s.x0 + (Math.min(Math.max(v, s.a), s.b) - s.a) / (s.b - s.a) * (s.x1 - s.x0); };
    // 같은 위치(10px 칸)에 겹치면 위로 쌓음, 칸당 최대 6개
    const GAP = 15, stack = {}, pos = dated.map(d => { const px = x(val(d)), b = Math.round(px / 10); stack[b] = (stack[b] || 0) + 1; return { d, px, b, i: stack[b] - 1 }; });
    const maxS = Math.min(6, Math.max(...Object.values(stack)));
    const T = 34, base = T + 8 + (maxS - 1) * GAP, AX = base + 11, H = AX + 20, rx = x(refV);
    svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="마감 타임라인 — 기준일 ${M.iso(S.ref)}">`;
    // 지난 쪽(기준일 왼쪽) 옅게
    svg += `<rect x="${L}" y="${T - 4}" width="${Math.max(0, rx - L)}" height="${AX - T + 4}" fill="var(--text2)" opacity=".07"/>`;
    segs.forEach(s => { svg += `<line x1="${s.x0}" x2="${s.x1}" y1="${AX}" y2="${AX}" stroke="var(--axis)"/>`; });
    if (segs.length > 1) { const bx = segs[0].x1 + BRK / 2; svg += `<path d="M${bx - 5},${AX + 5}L${bx - 1},${AX - 5}M${bx + 1},${AX + 5}L${bx + 5},${AX - 5}" stroke="var(--text2)" stroke-width="1.5"/><text x="${bx}" y="${AX + 17}" text-anchor="middle" font-size="10" fill="var(--muted)">생략</text>`; }
    const tick = (v, label, strong) => `<line x1="${x(v)}" x2="${x(v)}" y1="${AX}" y2="${AX + 4}" stroke="var(--axis)"/><text x="${x(v)}" y="${AX + 16}" text-anchor="middle" font-size="10.5" fill="var(${strong ? '--text' : '--muted'})"${strong ? ' font-weight="700"' : ''}>${label}</text>`;
    const main = segs.find(s => s.w > .5) || segs[0];
    if (rel) { const sp = main.b - main.a, st = sp > 120 ? 30 : sp > 60 ? 15 : 10; for (let v = Math.ceil(main.a / st) * st; v <= main.b; v += st) if (v !== 0 && (segs.length < 2 || Math.abs(x(v) - (segs[0].x1 + BRK / 2)) > 26)) svg += tick(v, dlab(v)); }
    else { const a = new Date(v0 * M.DAY), months = []; for (let y = a.getUTCFullYear(), mo = a.getUTCMonth() + 1; ; mo++) { const d = Date.UTC(y, mo, 1) / M.DAY; if (d > main.b) break; if (d >= main.a) months.push(d); }
      const every = Math.ceil(months.length / Math.max(1, Math.floor(W / 70))); months.forEach((d, k) => { if (k % every === 0) svg += tick(d, M.iso(d).slice(0, 7)); }); }
    // Lifting 일(D): 점선 + 마름모 (기준일 실선과 구분)
    if (rel) { const lx = x(0); svg += `<line x1="${lx}" x2="${lx}" y1="${T - 4}" y2="${AX}" stroke="var(--text)" stroke-dasharray="3 3" opacity=".7"/><path d="M${lx},${AX - 6}L${lx + 6},${AX}L${lx},${AX + 6}L${lx - 6},${AX}Z" fill="var(--text)" stroke="var(--card)" stroke-width="2" paint-order="stroke"/>` + `<text x="${lx}" y="${AX + 16}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text)" ${HALO}>D (Lifting)</text>`; }
    // 기준일: 굵은 실선 + 위쪽 배지
    const badge = `기준일 ${M.iso(S.ref)}${rel ? ' · ' + (refV < 0 ? `리프팅 D${refV}` : refV === 0 ? '리프팅 당일' : `리프팅 후 D+${refV}`) : ''}`, bw = textW(badge, 11) + 14;
    const bx0 = Math.min(Math.max(rx - bw / 2, L), W - R - bw);
    svg += `<line x1="${rx}" x2="${rx}" y1="20" y2="${AX}" stroke="var(--text)" stroke-width="2"/><rect x="${bx0}" y="2" width="${bw}" height="19" rx="9.5" fill="var(--text)"/><text x="${bx0 + bw / 2}" y="15.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--card)">${esc(badge)}</text>`;
    // 점 + 짧은 이름표 (같은 줄의 다른 점·이름표와 겹치지 않을 때만, 아니면 툴팁)
    const occ = {}, take = (i, a, b) => (occ[i] = occ[i] || []).push([a, b]), free = (i, a, b) => a >= L && b <= W - R && !(occ[i] || []).some(([p, q]) => a < q + 3 && b > p - 3) && !(a < rx + 3 && b > rx - 3);
    const shown = pos.filter(p => p.i < 6);
    shown.forEach(p => take(p.i, p.px - 6, p.px + 6));
    let labels = '';
    shown.forEach(p => {
      const lab = shortTxt(p.d.it.event, 18); if (!lab) return;
      const w = textW(lab), py = base - p.i * GAP;
      if (free(p.i, p.px + 11, p.px + 11 + w)) { take(p.i, p.px + 11, p.px + 11 + w); labels += `<text x="${p.px + 11}" y="${py + 3.5}" font-size="10.5" fill="var(--text2)" ${HALO}>${esc(lab)}</text>`; }
      else if (free(p.i, p.px - 11 - w, p.px - 11)) { take(p.i, p.px - 11 - w, p.px - 11); labels += `<text x="${p.px - 11}" y="${py + 3.5}" text-anchor="end" font-size="10.5" fill="var(--text2)" ${HALO}>${esc(lab)}</text>`; }
    });
    svg += labels;
    const over = {};
    pos.forEach(({ d, px, b, i }) => {
      if (i >= 6) { over[b] = (over[b] || 0) + 1; return; }
      const k = reg.length, py = base - i * GAP;
      reg.push({ it: d.it, st: d.st, when: `${M.iso(d.it.dueDay)}${rel ? ` (${dlab(val(d))})` : ''} · 기준일 ${dday(d.it.dueDay - S.ref)}` });
      svg += `<g class="hit" data-tl="${ti}:${k}">${shape(d.st.k, px, py, 4.5)}<circle cx="${px}" cy="${py}" r="11" fill="transparent"/></g>`;
    });
    Object.entries(over).forEach(([b, n]) => { svg += `<text x="${b * 10 + 6}" y="${T - 6}" font-size="10" fill="var(--muted)">+${n}</text>`; });
    svg = `<div class="tl">${svg}</svg></div>`;
  }
  const strip = undated.length ? `<div class="rulestrip">${MISS('날짜 없음')} <b>${undated.length}건</b> (Due Date 없음 — 타임라인 제외): ${undated.slice(0, 12).map(x => gotoBtn(key, x.it, `<span class="miss-txt">${esc(shortTxt(x.it.event, 28) || 'Event 미입력')}</span>`)).join(' · ')}${undated.length > 12 ? ` 외 ${undated.length - 12}건` : ''}</div>` : '';
  return svg + strip;
}
// opt: { pastCargo, anchor(카고 Lifting 시작일), extras, edit }

// ---------- 한 줄 알림 (규칙 기반 · 우선순위: 재고 위험 > 마감 > 생산 미달 > 현황) ----------
function insights(){
  const out = [], ref = S.ref, L = S.ledger?.model, C = S.check?.model, fd = d => M.iso(d).slice(5);
  if (L) {
    // 1) 최신 실적 재고 + 기준일~다음 리프팅일 예측 재고 중 Tank Top 초과 또는 0 미만 (기준일 이전의 지난 예측은 제외)
    const B = L.lastActual ?? ref - 1;
    [['LNG', L.lng, L.lngRef, L.lngLift.slots.find(s => s.start >= ref), 'cbm'],
     ['Condensate', L.cond, L.condRef, L.condLift.slots.find(s => s.start != null && s.start >= ref), 'bbl']].forEach(([nm, rows, refs, nx, u]) => {
      const tt = (refs || []).find(r => r.key === 'tank top'), end = nx ? nx.start : ref + 30;
      const hit = rows.find(x => (x.d === B || (x.d >= ref && x.d > B && x.d <= end)) && x.i != null && (x.i < 0 || (tt && x.i > tt.v)));
      if (!hit) return;
      const tail = nx ? ` — 다음 리프팅 ${nx.slot}(${fd(nx.start)}) 전에 확인 필요` : '';
      out.push({ p: 1, k: 'late', tag: '재고 위험', text: hit.i < 0
        ? `${nm} ${hit.d > B ? '예측 ' : ''}재고가 ${fd(hit.d)}에 0 미만(${fmt(hit.i)} ${u})${hit.d > B ? '이 될 전망' : ''}${tail}`
        : `${nm} 재고가 ${fd(hit.d)}에 ${tt.label} ${fmt(tt.v)} ${u}을 넘을 전망 (${fmt(hit.i)} ${u})${tail}` });
    });
  }
  if (C) {
    // 2) 지연·D-7 (실적 미입력 제외) — 가장 급한 항목: 임박이 있으면 가장 이른 임박, 없으면 가장 최근 지연
    const a = alertItems(), late = a.filter(x => x.st.k === 'late'), d7 = a.filter(x => x.st.k === 'd7');
    if (a.length) {
      const top = d7.length ? d7.sort((x, y) => x.it.dueDay - y.it.dueDay)[0] : late.sort((x, y) => y.it.dueDay - x.it.dueDay)[0];
      out.push({ p: 2, k: 'late', tag: '마감', nav: top.nav,
        text: `지연 ${late.length}건${d7.length ? ` · D-7 임박 ${d7.length}건` : ''} · 가장 급한 항목: ${top.it.event || '–'} (${dday(top.st.diff)}, ${top.where})` });
    }
  }
  if (L?.prod) {
    // 3) 그룹 첫 행(전체 생산)의 MTD 달성률 90% 미만
    const seen = new Set();
    L.prod.rows.forEach(r => {
      if (seen.has(r.group)) return; seen.add(r.group);
      const v = r.vals[5], unit = (r.group.match(/\(([^)]+)\)/) || [])[1] || '', nm = r.group.replace(/\s*\(.*$/, '');
      if (M.isNum(v) && v < .9) out.push({ p: 3, v, k: 'd7', tag: '생산 미달', text: `${nm} MTD 달성률 ${fmt(v * 100, 1)}% (계획 ${fmt(r.vals[3])} ${unit} 대비 ${fmt(r.vals[1])} ${unit})` });
    });
  }
  if (L) {
    // 4) 현황: 다음 LNG 리프팅 + 최신 재고의 Tank Top 대비 %
    const B = L.lastActual ?? ref - 1, nx = L.lngLift.slots.find(s => s.start >= ref), inv = (L.lng.find(x => x.d === B) || {}).i, tt = (L.lngRef || []).find(r => r.key === 'tank top');
    out.push({ p: 4, k: 'plan', tag: '현황', text: `${nx ? `다음 LNG 리프팅 ${nx.slot} ${fd(nx.start)} (${dday(nx.start - ref)})` : '기준일 이후 LNG 리프팅 없음'} · LNG 재고 ${fmt(inv)} cbm${tt && M.isNum(inv) ? ` (${tt.label} 대비 ${fmt(inv / tt.v * 100)}%)` : ''} · 최신 보고일 ${M.iso(B)}` });
  }
  return out.sort((a, b) => a.p - b.p || (a.v ?? 0) - (b.v ?? 0));
}
function edBar(sh){

    + `<button type="button" class="btn primary" data-save="1"${n ? '' : ' disabled'} title="원본 워크북을 바탕으로 새 .xlsx를 만듭니다. SheetJS 무료판은 셀 서식(색·테두리)을 보존하지 않으며 값과 구조만 유지합니다.">수정본 엑셀 저장</button>`

function insightBar(){

// ---------- 체크리스트 편집 (브라우저 저장 없음 · "수정본 엑셀 저장"으로만 남김) ----------
let newRowId = 900000;
function snapshotOrig(model){ model.sheets.forEach(sh => { sh._orig = sh.rows.map(x => ({ ...x, extra: [...(x.extra || [])] })); sh._del = 0; }); }
const isEdited = it => it._new || (it._ed && it._ed.length);
const editCount = () => (S.check?.model.sheets || []).reduce((n, sh) => n + sh.rows.filter(isEdited).length + (sh._del || 0), 0);
const chkSheet = name => S.check.model.sheets.find(x => x.name === name);
function editorRow(sh, it, ncol){
  const v = d => d == null ? '' : M.iso(d), f = (lab, html) => `<label class="ef"><span>${lab}</span>${html}</label>`, inp = (n, val) => `<input name="${n}" value="${esc(val || '')}">`;
  return `<tr class="editrow no-print" data-ed="${esc(sh.name)}|${it.r}"><td colspan="${ncol}"><div class="edform">
    ${f('Due Date', `<input type="date" name="due" value="${v(it.dueDay)}">`)}${f('Due Date 텍스트 (날짜 없을 때)', inp('dueText', it.dueText))}${f('Due 규칙', inp('dueRule', it.dueRule))}
    ${f('Actual', `<input type="date" name="act" value="${v(it.actualDay)}">`)}${f('Actual 텍스트 (날짜 없을 때)', inp('actText', it.actualText))}${f('Event', inp('event', it.event))}
    ${f('Contract', inp('contract', it.contract))}${f('Clauses', inp('clauses', it.clauses))}${f('From', inp('from', it.from))}${f('To', inp('to', it.to))}
    ${(sh.extras || []).map((x, k) => f(esc(x), inp('x' + k, (it.extra || [])[k]))).join('')}
    <label class="ef wide"><span>Items covered</span><textarea name="items" rows="3">${esc(it.items || '')}</textarea></label>
    <div class="edbtns"><button type="button" class="btn primary" data-apply="1">적용</button><button type="button" class="btn" data-ecancel="1">취소</button><button type="button" class="btn" data-del="1">행 삭제</button></div>
  </div></td></tr>`;
}
function flashRow(id){ requestAnimationFrame(() => { const tr = document.getElementById(id); if (tr) { tr.scrollIntoView({ block: 'center' }); tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); } }); }
const rowId = (name, r) => 'chk-' + name.replace(/\W/g, '') + '-' + r;
function applyEdit(tr){
  const [name, r] = tr.dataset.ed.split('|'), sh = chkSheet(name), it = sh.rows.find(x => String(x.r) === r);
  const q = n => (tr.querySelector(`[name="${n}"]`) || {}).value || '';
  const dayOf = s => s ? Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / M.DAY : null;
  const nv = { contract: q('contract').trim(), clauses: q('clauses').trim(), from: q('from').trim(), to: q('to').trim(), event: q('event').trim(), items: q('items').trim(), dueRule: q('dueRule').trim(),
    dueDay: dayOf(q('due')), dueText: q('due') ? '' : q('dueText').trim(), actualDay: dayOf(q('act')), actualText: q('act') ? '' : q('actText').trim() };
  const ed = new Set(it._ed || []);
  const flat = v => String(v ?? '').replace(/[\r\n]/g, '').trim();   // <input>은 줄바꿈을 지움
  for (const k in nv) { const a = nv[k] ?? '', b = it[k] ?? ''; if (a === b || (k !== 'items' && typeof a === 'string' && flat(a) === flat(b))) continue; it[k] = nv[k]; ed.add(k); }
  (sh.extras || []).forEach((x, k) => { const val = q('x' + k).trim(); if (flat(val) !== flat((it.extra || [])[k])) { it.extra[k] = val; ed.add('x' + k); } });
  it._ed = [...ed]; delete it._fresh; S.editing = null;
  sh.rows = M.sortRows(sh.rows); render(); flashRow(rowId(name, it.r));
}
function addRow(name){
  const sh = chkSheet(name), it = { r: newRowId++, contract: '', clauses: '', from: '', to: '', event: '', items: '', dueRule: '', dueDay: null, dueText: '', actualDay: null, actualText: '', extra: (sh.extras || []).map(() => ''), _new: true, _fresh: true, _ed: [] };
  sh.rows.push(it); S.editing = name + '|' + it.r; delete S.filters[rowId(name, '').slice(0, -1)]; render(); flashRow(rowId(name, it.r));
}
function deleteRow(tr){
  const [name, r] = tr.dataset.ed.split('|'), sh = chkSheet(name), it = sh.rows.find(x => String(x.r) === r);
  if (!it._fresh && !confirm(`이 행을 삭제할까요?\n${it.event || '(Event 없음)'}`)) return;
  sh.rows = sh.rows.filter(x => x !== it); if (!it._new) sh._del++; S.editing = null; render();
}
function cancelEdit(tr){
  const [name, r] = tr.dataset.ed.split('|'), sh = chkSheet(name), it = sh.rows.find(x => String(x.r) === r);
  if (it && it._fresh) sh.rows = sh.rows.filter(x => x !== it);   // 적용 전 새 행은 버림
  S.editing = null; render();
}
function undoAll(){ S.check.model.sheets.forEach(sh => { if (sh._orig) { sh.rows = sh._orig.map(x => ({ ...x, extra: [...(x.extra || [])] })); sh._del = 0; } }); S.editing = null; render(); }
// 원본 워크북을 다시 읽어 수정된 체크리스트 시트의 표 영역만 정렬 순서대로 다시 씀 (다른 시트·표 밖 셀은 그대로)
// 시트마다 데이터가 실제로 온 파일·시트에 씀 — 합친 워크북이면 그 한 파일, 여러 파일이면 파일마다 하나씩
function saveEdited(){
  const c = S.check, enc = (r, col) => XLSX.utils.encode_cell({ r, c: col }), byFile = new Map();
  c.model.sheets.forEach(sh => {
    if (!sh.meta || !(sh._del || sh.rows.some(isEdited))) return;
    const src = c.src[sh.name]; if (!src) return;
    if (!byFile.has(src.file)) byFile.set(src.file, []);
    byFile.get(src.file).push([sh, src.sheet]);
  });
  S.saved = [];
  byFile.forEach((list, file) => {
    const wb = XLSX.read(file.buf, { type: 'array', cellNF: true });   // cellDates 없이 + 숫자 서식 유지: 날짜는 서식 붙은 일련번호 그대로
    list.forEach(([sh, real]) => {
      const ws = wb.Sheets[real], m = sh.meta, cols = [...new Set(Object.values(m.cols).filter(x => x >= 0).concat(m.extraCols))], old = {};
      for (let r = m.hr + 2; r <= m.lastRow; r++) cols.forEach(col => { const cell = ws[enc(r, col)]; if (cell) old[r + ',' + col] = cell; delete ws[enc(r, col)]; });
      const field = { contract: m.cols.contract, clauses: m.cols.clauses, from: m.cols.from, to: m.cols.to, event: m.cols.event, items: m.cols['items covered'], dueRule: m.cols.due };
      const str = v => v ? { t: 's', v } : null, date = d => d == null ? null : { t: 'n', v: d + 25569, z: 'yyyy-mm-dd' };
      sh.rows.forEach((it, k) => {
        const r = m.hr + 2 + k, ed = new Set(it._ed || []);
        const put = (col, cell) => { if (col == null || col < 0) return; if (cell) ws[enc(r, col)] = cell; else delete ws[enc(r, col)]; };
        // 원래 행의 셀을 그대로 옮김 (수식은 계산값으로 고정)
        if (!it._new) cols.forEach(col => { const src = old[it.r + ',' + col]; if (src) { const cp = { ...src }; delete cp.f; ws[enc(r, col)] = cp; } });
        for (const [key, col] of Object.entries(field)) if (it._new || ed.has(key)) put(col, str(it[key]));
        if (it._new || ed.has('dueDay') || ed.has('dueText')) put(m.cols['due date'], it.dueDay != null ? date(it.dueDay) : str(it.dueText));
        if (it._new || ed.has('actualDay') || ed.has('actualText')) put(m.cols.actual, it.actualDay != null ? date(it.actualDay) : str(it.actualText));
        m.extraCols.forEach((col, j) => { if (it._new || ed.has('x' + j)) put(col, str(it.extra[j])); });
      });
      const R = XLSX.utils.decode_range(ws['!ref']); R.e.r = Math.max(R.e.r, m.hr + 1 + sh.rows.length); ws['!ref'] = XLSX.utils.encode_range(R);
    });
    // SheetJS는 문자열 속 CR+LF를 그대로 읽고 CR을 _x000d_ 로 써서 다른 프로그램에 글자로 보임 → 줄바꿈을 LF로 정규화
    wb.SheetNames.forEach(n => { const ws = wb.Sheets[n]; for (const k in ws) { const cell = ws[k]; if (k[0] !== '!' && cell && cell.t === 's' && typeof cell.v === 'string' && /\r/.test(cell.v)) { cell.v = cell.v.replace(/\r\n?/g, '\n'); delete cell.h; delete cell.r; delete cell.w; } } });
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const name = file.name.replace(/\.xls[xm]?$/i, '') + `_수정_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}.xlsx`;
    const data = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    S.lastSaved = { name, data }; S.saved.push({ name, data });   // 메모리에만 (브라우저 저장소 아님) — 확인·테스트용
    const el = document.createElement('a');

  });
}

// ---------- Tab 3: Cargo Operation (LNG) ----------
function cargoNotes(m){

  if (m._noted || !m.schedule || !m.cargo) return; m._noted = true;
  const have = new Set(m.cargo.pairs.map(p => M.norm(p.slot)));
  m.schedule.slots.forEach(s => { if (!have.has(M.norm(s.slot))) m.issues.push({ level: 'warn', sheet: 'Cargo', header: s.slot, msg: 'Cargo 시트에 이 카고의 체크리스트 열이 없습니다' }); });
  const inSched = new Set(m.schedule.slots.map(s => M.norm(s.slot)));
  m.cargo.pairs.forEach(p => { if (!inSched.has(M.norm(p.slot))) m.issues.push({ level: 'warn', sheet: 'Cargo', header: p.slot, msg: '"일정" 시트에 없는 슬롯 — Cargo 탭에 표시되지 않음' }); });
}

      ${pair ? checklistBlock('cg-' + s.slot.replace(/\W/g, ''), pair.rows, 'Cargo ' + s.slot, { pastCargo: cargoPast(s), anchor: s.start }) : m.err.cargo ? errBox(m.err.cargo) : `<div class="placeholder">Cargo 시트에 이 카고의 체크리스트 열이 없습니다.</div>`}</section>`;

function renderHistory(g){
  if (!g) return errBox(S.check.model.err.history || '"History (연단위)" 시트를 읽지 못했습니다');
  const rows = g.rows, width = Math.max(0, ...rows.map(r => r.length));
  const usedCols = [...Array(width).keys()].filter(c => rows.some(r => !M.isEmpty(r[c])));
  const usedRows = [...rows.keys()].filter(r => rows[r].some(v => !M.isEmpty(v)));
  const span = {}, skip = new Set();
  g.merges.forEach(mg => { span[mg.s.r + ',' + mg.s.c] = mg; for (let r = mg.s.r; r <= mg.e.r; r++) for (let c = mg.s.c; c <= mg.e.c; c++) if (r !== mg.s.r || c !== mg.s.c) skip.add(r + ',' + c); });
  const show = v => v instanceof Date ? M.iso(M.asDay(v)) : M.isErr(v) ? '–' : typeof v === 'boolean' ? (v ? 'TRUE' : 'FALSE') : M.isNum(v) ? fmt(v, Math.abs(v) < 100 && v % 1 ? 2 : 0) : esc(v ?? '');
  return `<section class="card"><h2>연간 History</h2><div class="tw"><table class="t-hist" data-sheet="History"><tbody>${usedRows.map(r => `<tr>${usedCols.map(c => {
    if (skip.has(r + ',' + c)) return '';
    const mg = span[r + ',' + c], v = rows[r][c];
    const rs = mg ? usedRows.filter(x => x >= mg.s.r && x <= mg.e.r).length : 1, cs = mg ? usedCols.filter(x => x >= mg.s.c && x <= mg.e.c).length : 1;
    const raw = v instanceof Date ? M.iso(M.asDay(v)) : M.isErr(v) ? '' : v ?? '';
    return `<td${rs > 1 ? ` rowspan="${rs}"` : ''}${cs > 1 ? ` colspan="${cs}"` : ''}${M.isNum(v) ? ' class="num" data-t="n"' : ' data-t="s"'} data-v="${esc(raw)}" style="white-space:pre-line">${show(v)}</td>`;
  }).join('')}</tr>`).join('')}</tbody></table></div><p class="note">엑셀 오류값은 "–"로 표시하고 데이터 점검에 기록합니다.</p></section>`;
}

// ---------- 샘플 데이터 (임의 생성 값 · 실제 값 아님) ----------
// 시드 고정 난수 + 기준일 기준 상대 날짜로 두 워크북을 만들고, .xlsx로 써서 실제 파일과 같은 경로(loadFiles)로 읽음
const isSample = () => !!(S.ledger?.sample || S.check?.sample);
function sampleBooks(){
  let seed = 20240607; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const step = (base, n, q) => base + Math.round(rnd() * n) * q;
  const R = S.ref, B = R - 2, D = d => { const t = new Date(d * M.DAY); return new Date(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
  const span = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
  const book = sheets => { const wb = XLSX.utils.book_new(); sheets.forEach(([n, aoa]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), n)); return wb; };
  const LIFT = ['Partner A', 'Partner B', 'Partner C'], SHIP = ['Vessel Alpha', 'Vessel Bravo', 'Vessel Charlie', 'Vessel Delta'];
  // LNG 슬롯: 8일 간격. 10번째 슬롯은 일부러 크게 → 예측 재고 0 미만 경고 예시
  const slots = span(0, 13).map(k => ({ id: `S${String(k + 1).padStart(2, '0')}-26`, st: R - 56 + k * 8, lifter: LIFT[k % 3], ship: SHIP[k % 4], plan: [160000, 150000, 155000][k % 3] + (k === 9 ? 30000 : 0) }));
  const sdsLast = [...slots].reverse().find(s => s.st <= R + 30);
  let inv = 90000; const lng = span(R - 60, R + 45).map(d => { const p = d <= B ? step(18500, 8, 250) : 19500; inv += p; const s = slots.find(x => x.st === d); if (s) inv -= s.plan; return [null, D(d), p, inv]; });
  const cl = [{ id: 'C01-26', st: R - 20, parts: [['Partner A', 300000], ['Partner B', 200000]] }, { id: 'C02-26', st: R + 25, parts: [['Partner B', 500000]] }];
  let ci = 300000; const cond = span(R - 60, R + 45).map(d => { const p = d <= B ? step(7600, 8, 100) : 8000; ci += p; const c = cl.find(x => x.st === d); if (c) ci -= 500000; return [null, D(d), p, ci]; });
  const fg = span(R - 60, R + 30).map(d => [null, D(d), d <= B ? 16000 : null, d <= B ? 600 : null, null, d <= B ? (d === R - 20 ? 300 : step(545, 8, 5)) : null]);
  let b = 80, j = 12; const px = span(R - 120, B).filter(d => new Date(d * M.DAY).getUTCDay() % 6).map(d => (b = Math.round((b + (rnd() - .5) * 3) * 20) / 20, j = Math.round((j + (rnd() - .5) * .5) * 100) / 100, [d, b, j]));
  const mon = {}; px.forEach(([d, bb, jj]) => { const k = M.iso(d).slice(0, 7); (mon[k] = mon[k] || []).push([bb, jj]); });
  const brent = [['날짜', 'Brent가격', 'JKM월물', 'JKM가격', null, '월', 'Brent 월평균', null, 'JKM 월평균']].concat(px.map(([d, bb, jj], i) => {
    const m = Object.entries(mon)[i], avg = k => m && m[1].reduce((a, v) => a + v[k], 0) / m[1].length;
    return [D(d), bb, null, jj, null, m ? D(Date.UTC(+m[0].slice(0, 4), +m[0].slice(5) - 1, 1) / M.DAY) : null, m ? avg(0) : null, null, m ? avg(1) : null]; }));
  const lngB = lng.find(r => +r[1] === +D(B))[2] / 1000, fgB = fg.find(r => +r[1] === +D(B))[5];
  const pr = (g, sub, day, mtd, ytd, pm, py) => [null, g, sub, day, mtd, ytd, pm, py, pm ? mtd / pm : null, py ? ytd / py : null];
  const ledger = book([
    ['Operation Daily', [[null, 'Barossa & DLNG Production'], [null, null, null, 'Actual', null, null, 'Plan (샘플)', null, 'Actual vs Plan'], [null, null, null, D(B), 'MTD', 'YTD', 'MTD', 'YTD', 'MTD', 'YTD'],
      pr('Feed Gas Export (mmscf)', null, fgB, 8400, 120000, 9000, 150000), pr('LNG (Kcbm)', 'JV Prod.', lngB, 290, 4200, 300, 5000), pr(null, 'Partner B Net', lngB * .4, 116, 1680, 120, 2000), pr(null, 'Partner B Load', 0, 155, 930, 160, 1100),
      pr('Condensate (Kbbl)', 'JV Prod.', 8, 120, 1700, 125, 2000), pr(null, 'Partner B Net', 3.2, 48, 680, 50, 800), pr(null, 'Partner B Load', 0, 0, 200, 0, 250)]],
    ['Feed Gas', [['Month', 'Date', 'Gas Export'], [null, null, 'Nomination', null, 'Actual'], [null, null, 'kNm3', 'MMscf', 'kNm3', 'MMscf'], ...fg]],
    ['Forecast', [[null, 'Date', 'Production Rate', 'Feed Gas', 'LNG', 'Condensate'], ...span(R - 60, R + 60).map(d => [null, D(d), .95, 580, 19500, 8000])]],
    ['Ledger_ADP 및 SDS', [[null, '[LNG Balance Ledger (cbm)]'], [null, 'Working Capacity', 200000, 'cbm'], [null, 'Tank Top', 180000, 'cbm'], [null, 'Unpumpable', 15000, 'cbm'], [null, 'Date', 'Production', 'Inventory'], ...lng]],
    ['Condensate Ledger', [[null, '[Condensate Balance Ledger (bbl)]'], [null, 'Working Capacity', 900000, 'bbl'], [null, 'Tank Top', 700000, 'bbl'], [null, 'Unpumpable', 200000, 'bbl'], [null, 'Date', 'Production', 'Inventory'], ...cond]],
    ['ADP 및 SDS', [['ADP'], ['Issue', D(R - 20), null, 'last confirmed SDS slot', sdsLast.id], ['Slot Number', 'Lifting Slot', null, null, 'Lifter', 'Cargo Size (Planned_cbm)', 'Cargo Size (Actual_cbm)', 'Proposed Vessel'],
      ...slots.map(s => [s.id, D(s.st), '~', D(s.st + 1), s.lifter, s.plan, s.st <= B ? s.plan - step(0, 10, 100) : null, s.ship])]],
    ['LP', [['Condensate Lifting Plan'], ['Issue', D(R - 30)], ['Slot Number', 'Lifting Slot', null, null, 'Lifter', 'Cargo Size (Planned_bbl)', 'Cargo Size (Actual_bbl)', 'Proposed Vessel'],
      ...cl.flatMap(c => c.parts.map(([l, v], k) => [k ? null : c.id, k ? null : D(c.st), k ? null : '~', k ? null : D(c.st + 2), l, v, c.st <= B ? v : null, k ? null : 'Vessel Echo']))]],
    ['BrentnJKM', brent]]);

  // 체크리스트: 기준일 대비 마감 오프셋(일) → 완료/지연/D-7/D-30/예정/수시 상태가 고르게 나오도록
  const ITEMS = [' - 일정 요약\n - 담당자 연락처\n - 첨부 서류 목록', ' - 대상 기간\n - 예상 수량', ' - 변경 사유\n - 변경 전/후 비교\n - 승인 요청'];
  const it = (k, ev, rule, due, act) => [`Contract ${'XYZ'[k % 3]}`, `${k % 5 + 1}.${k % 3 + 1}`, `Party ${k % 2 + 1}`, `Party ${2 - k % 2}`, ev, ITEMS[k % 3], rule,
    typeof due === 'number' ? D(R + due) : due, act == null ? null : D(R + act)];
  const cyStart = Date.UTC(new Date(R * M.DAY).getUTCFullYear() + 1, 0, 1) / M.DAY;
  const chk = rows => [['Contract', 'Clauses', 'Contract Party', null, 'Event', 'Items covered', 'CY Start', D(cyStart), 'Actual'], [null, null, 'From', 'To', null, null, 'Due', 'Due Date'], ...rows];
  const adp = chk([it(0, '연간 일정 통보', 'CY-6M', -40, -42), it(1, '정비 계획 공유', 'CY-5M', -25), it(2, '선박 정보 제출', 'CY-4M', -6), it(3, '예비 일정 제안', 'CY-3M', 3),
    it(4, '수량 통보', 'CY-3M', 6), it(5, '예비 ADP 확정', 'CY-2M', 18), it(6, '변경 요청 협의', 'CY-2M', 28), it(7, '최종 일정 확정', 'CY-1M', 50), it(8, '연간 계획 확정 통보', 'CY-1M', 75)]);
  const annual = chk([it(0, '연간 정산 보고', null, '매년 1/20'), it(1, '보증서 갱신', null, -60), it(2, '예산 제출', null, -100, -98), it(3, '연간 회의 소집', null, '(일정 없음)'), it(4, '중기 계획 제출', null, 120)]);
  const monthly = chk([it(0, '월간 실적 보고', null, null, -3), it(1, '월간 청구서 발행', '+10 영업일'), it(2, '월간 작업 보고', '+15 영업일'), it(3, '월간 출하 계획', null, '매월 말일')]);
  const sched = [4, 7, 10, 13].map(k => slots[k]), pairs = sched.slice(0, 3);   // 마지막 슬롯은 Cargo 열 없음 → 데이터 점검 예시
  const OFF = [[30, '선박 지정 통보'], [21, '선박 정보 제출'], [14, '검정인 지정'], [7, '서류 지시'], [4, '96시간 전 통보'], [2, '48시간 전 통보'], [1, '24시간 전 통보'], [0, '하역 준비 완료 통보'], [-1, '출항 통보'], [-7, '선적 서류 송부'], [-30, '정산 자료 송부'], ['선적 후 즉시', '수량 확인'], ['매월', '가격 협의']];
  const cg = [['Contract', 'Clauses', 'Contract Party', null, 'Event', 'Items covered', 'Slot No.', ...pairs.flatMap(p => [p.id, null])],
    [null, null, null, null, null, null, 'Lifting Slot', ...pairs.flatMap(p => [D(p.st), null])], [null, null, null, null, null, null, 'LNG Ship', ...pairs.flatMap(p => [p.ship, null])],
    [null, null, null, null, null, null, 'Lifting Vol.', ...pairs.flatMap(p => [p.plan, null])], [null, null, 'From', 'To', null, null, 'Due', ...pairs.flatMap(() => ['Due Date', 'Actual'])],
    ...OFF.map(([o, ev], k) => [`Contract ${'XYZ'[k % 3]}`, `${k % 4 + 6}.${k % 2 + 1}`, `Party ${k % 2 + 1}`, `Party ${2 - k % 2}`, ev, ITEMS[k % 3], o, ...pairs.flatMap((p, pi) => {
      if (typeof o !== 'number') return [null, null];
      const due = p.st - o, done = due < R && (pi === 0 ? o >= 7 : o >= 14 || (pi === 2 && o === 30));
      return [D(due), done ? D(due - 1) : null]; })])];
  const check = book([
    ['ADP Process', adp], ['Annual', annual], ['Monthly', monthly],
    ['일정', [['SDS'], [], ['As of', D(R - 7)], ['Slot Number', 'Lifting Slot', null, null, 'Lifter', 'Lifting Vol.', 'Planned Cargo Size (MMBtu)', 'Actual (cbm)', 'Actual (MMBtu)', 'LNG Ship', 'Cargo Capacity', 'Ship Type', 'Departing Port'],
      ...sched.map(s => [s.id, D(s.st), '~', D(s.st + 1), s.lifter, s.plan, s.plan * 23, s.st <= B ? s.plan - 200 : null, s.st <= B ? (s.plan - 200) * 23 : null, s.ship, 175000, 'Membrane', 'Port North'])]],
    ['Cargo', cg],
    ['History (연단위)', [['Cargo No.', null, null, ...pairs.map(p => p.id), '연간 (AVG)'], ['Lifter', null, null, ...pairs.map(p => p.lifter)],
      ['SPEC', 'GHV', 'BTU/SCF', 1060, 1065, 1062, 1062.3], [null, 'C1 Methane', 'mol%', 94.5, 94.2, 94.8, 94.5],
      ['Quantities', 'Delivered', 'cbm', ...pairs.map(p => p.plan - 200), null], [null, null, 'MMBtu', ...pairs.map(p => (p.plan - 200) * 23), null]]]]);
  return [ledger, check];
}
async function loadSample(){
  if (typeof XLSX === 'undefined') { $('#loadMsg').textContent = 'SheetJS 라이브러리를 불러오지 못했습니다 (네트워크 확인).'; return; }
  const file = (wb, n) => new File([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], n);
  const [a, b] = sampleBooks();
  await loadFiles([file(a, 'sample-ledger.xlsx'), file(b, 'sample-checklist.xlsx')], true);
}

// 시트 풀: 불러온 파일 전부. 같은 이름 파일을 다시 넣으면 교체
let fileSeq = 1;
S.files = []; S.manual = {}; S.match = {};
function rebuild(){
  const res = S.match = M.resolveSheets(S.files, S.manual);
  const make = group => {
    const wb = { SheetNames: [], Sheets: {} }, src = {}, used = new Set();
    M.GROUPS[group].forEach(L => { const r = res[L]; if (r.file) { wb.SheetNames.push(L); wb.Sheets[L] = r.file.wb.Sheets[r.sheet]; src[L] = { file: r.file, sheet: r.sheet }; used.add(r.file); } });
    return { wb, src, used: [...used] };
  };
  const ld = make('ledger'), ck = make('check');
  const note = (model, group) => M.GROUPS[group].forEach(L => {
    const r = res[L];
    if (r.status === 'ambiguous') {
      const i = model.issues.findIndex(x => x.sheet === L && x.header === '(시트)'); if (i >= 0) model.issues.splice(i, 1);
      model.issues.unshift({ level: 'warn', sheet: L, header: '(시트 매칭)', msg: `후보가 여러 개라 고르지 않음 (${r.cands.join(', ')}) — "시트 매칭"에서 직접 고르세요` });
      const msg = `'${L}' 시트 후보가 여러 개입니다 — 아래 "시트 매칭"에서 직접 고르세요`, sec = ({ 'Feed Gas': 'fg', Forecast: 'fc', 'Ledger_ADP 및 SDS': 'lng', 'Condensate Ledger': 'cond', 'ADP 및 SDS': 'lngLift', LP: 'condLift', 'Operation Daily': 'prod', BrentnJKM: 'price', '일정': 'schedule', Cargo: 'cargo', 'History (연단위)': 'history' })[L] || L;
      model.err[sec] = msg; (model.sheets || []).forEach(sh => { if (sh.name === L) sh.err = msg; });
    }
    if (r.status === 'dup') model.issues.push({ level: 'info', sheet: L, header: '(시트 매칭)', msg: `같은 시트가 여러 파일에 있어 나중 파일 사용: ${r.file.name} › ${r.sheet} (사용 안 함: ${r.dup.join(', ')})` });
    if (r.how === '헤더') model.issues.push({ level: 'info', sheet: L, header: '(시트 매칭)', msg: `이름이 달라 헤더로 찾음: ${r.file.name} › ${r.sheet}` });
    // 직접 고른 시트의 헤더가 이 논리 시트와 맞지 않으면 경고 (선택은 그대로 따름)
    if (r.how === '수동' && !M.sheetFP(r.file.wb.Sheets[r.sheet]).includes(L)) model.issues.unshift({ level: 'warn', sheet: L, header: '(시트 매칭)', msg: `직접 고른 ${r.file.name} › ${r.sheet} 의 헤더가 '${L}' 형식과 맞지 않습니다 — 값이 틀릴 수 있음` });
  });
  const names = used => [...new Set(used.map(f => f.name))].join(', ');
  S.ledger = ld.wb.SheetNames.length ? { name: names(ld.used), model: M.parseLedger(ld.wb), sample: ld.used.some(f => f.sample), src: ld.src } : null;
  if (S.ledger) note(S.ledger.model, 'ledger');
  S.check = ck.wb.SheetNames.length ? { name: names(ck.used), model: M.parseCheck(ck.wb), sample: ck.used.some(f => f.sample), src: ck.src } : null;
  if (S.check) { note(S.check.model, 'check'); snapshotOrig(S.check.model); }
  S.editing = null;
}
// 저장하지 않은 수정이 있으면 다시 만들기 전에 확인
const dropEdits = () => !editCount() || confirm(`저장하지 않은 체크리스트 수정 ${editCount()}건이 사라집니다. 계속할까요?`);
async function loadFiles(files, sample = false){
  const msg = $('#loadMsg'); msg.textContent = '';
  if (typeof XLSX === 'undefined') { msg.textContent = 'SheetJS 라이브러리를 불러오지 못했습니다 (네트워크 확인). cdn.jsdelivr.net 접속이 필요합니다.'; alert(msg.textContent); return; }
  if (!dropEdits()) return;
  const errs = [], added = [], hadCheck = S.check?.name;
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer(), wb = XLSX.read(buf, { type: 'array', cellDates: true });
      S.files = S.files.filter(x => x.name !== f.name);
      const entry = { id: fileSeq++, name: f.name, wb, buf, sample }; S.files.push(entry); added.push(entry);
    } catch (err) { errs.push(`${f.name}: 읽기 실패 — ${err.message}`); }
  }
  rebuild();
  // 어떤 논리 시트에도 쓰이지 않고 후보도 아닌 파일은 알리고 뺌
  added.forEach(e => {
    const usedHere = Object.values(S.match).some(r => r.file === e || (r.cands || []).some(c => c.startsWith(e.name + ' › ')) || (r.dup || []).some(c => c.startsWith(e.name + ' › ')));
    if (!usedHere) { errs.push(`${e.name}: 필요한 시트와 맞는 것이 없습니다 (시트 이름·헤더 모두 불일치).`); S.files = S.files.filter(x => x !== e); }
  });
  if (errs.length) { rebuild(); msg.textContent = errs.join(' / '); if (S.ledger || S.check) alert(errs.join('\n')); }
  render();
  const gotCheck = added.some(e => S.check && Object.values(S.check.src).some(x => x.file === e)) || (S.check && S.check.name !== hadCheck);
  if (gotCheck || (!S.alerted && S._alerts?.length)) { S.alerted = true; if (S._alerts?.length) openAlerts(S._alerts); }
}
// 시트 매칭 표의 직접 선택
document.addEventListener('change', e => {
  const sel = e.target.closest && e.target.closest('select[data-match]'); if (!sel) return;
  if (!dropEdits()) { render(); return; }
  if (sel.value) S.manual[sel.dataset.match] = sel.value; else delete S.manual[sel.dataset.match];
  rebuild(); render();
});
function renderMatch(){
  const res = S.match || {}, groups = Object.entries(M.GROUPS).filter(([, Ls]) => Ls.some(L => res[L] && res[L].file));
  const pool = S.files.flatMap(f => f.wb.SheetNames.map(sh => [f.id + '|' + sh, `${f.name} › ${sh}`]));
  const st = r => r.status === 'ok' ? '<span class="pill st-done">정상</span>' : r.status === 'dup' ? `<span class="pill st-plan">중복</span> <span class="muted">사용 안 함: ${esc(r.dup.join(', '))}</span>`
    : r.status === 'ambiguous' ? `<span class="pill st-late">▲ 모호</span> <span class="muted">후보: ${esc(r.cands.join(', '))}</span>` : `<span class="miss-in">⊘ 없음</span>`;
  let warn = 0;
  const rows = groups.map(([g, Ls]) => Ls.map(L => {
    const r = res[L] || {}; if (r.status === 'ambiguous' || r.status === 'none') warn++;
    return `<tr><td>${esc(g === 'ledger' ? 'Ledger' : '체크리스트')}</td><td><b>${esc(L)}</b></td><td>${r.file ? esc(r.file.name) : '–'}</td><td>${r.file ? esc(r.sheet) : '–'}</td><td>${esc(r.how || '–')}</td><td>${st(r)}</td>
      <td><select data-match="${esc(L)}" aria-label="${esc(L)} 시트 직접 선택"><option value="">(자동)</option>${pool.map(([k, lab]) => `<option value="${esc(k)}"${S.manual[L] === k ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></td></tr>`;
  }).join('')).join('');
  $('#matchPanel').querySelector('summary').textContent = `시트 매칭 — 파일 ${S.files.length}개${warn ? ` · 경고 ${warn}건` : ''}`;
  $('#matchBody').innerHTML = `<div class="tw"><table class="t-match"><thead><tr><th>구분</th><th>필요한 시트</th><th>파일</th><th>실제 시트</th><th>방법</th><th>상태</th><th>직접 선택</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">이름이 같은 시트를 먼저 쓰고, 없으면 헤더로 찾습니다. 같은 시트가 여러 파일에 있으면 나중에 불러온 파일을 씁니다. 직접 선택은 이 화면에서만 유지됩니다.</p>`;
  if (warn) $('#matchPanel').open = true;
}
$('#fileInput').addEventListener('change', e => { loadFiles([...e.target.files]); e.target.value = ''; });
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); $('#loader').classList.add('drag'); $('#filebar').classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'dragleave' && e.relatedTarget) return; $('#loader').classList.remove('drag'); $('#filebar').classList.remove('drag'); }));
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer?.files?.length) loadFiles([...e.dataTransfer.files]); });

// 테마 (선호값만 브라우저에 저장, 데이터는 저장하지 않음)
function setTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { setTheme(localStorage.getItem('barossa-theme')); } catch (_) {}
$('#btnTheme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; setTheme(next);
  try { localStorage.setItem('barossa-theme', next); } catch (_) {}
};

// PDF 출력 / 엑셀 내보내기 — 현재 탭만
const tabName = () => (TABS.find(t => t[0] === S.tab) || [])[1] + (S.tab === 'check' && S.check ? ` · ${S.cy} · ${S.sheet}` : S.tab === 'cargo' && S.check ? ` · ${S.year} · ${S.cargo === '__hist' ? '연간 History' : S.cargo}` : '');
function tabPath(){
  if (S.tab === 'check') return ['Periodical Checklist', S.cy, S.sheet];
  if (S.tab === 'cargo') { const sl = (S.check?.model.schedule?.slots || []).filter(s => (s.start == null ? '날짜 없음' : String(new Date(s.start * M.DAY).getUTCFullYear())) === S.year);
    const k = sl.findIndex(s => s.slot === S.cargo); return ['Cargo Operation (LNG)', S.year, S.cargo === '__hist' ? '연간 History' : k >= 0 ? `#${k + 1} ${S.cargo}` : S.cargo]; }
  return ['Production Overview'];
}
function printHeader(){
  const n = new Date(), ts = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')} ${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
  $('#printHead').innerHTML = `<b>${esc(tabPath().filter(Boolean).join(' › '))}</b><span>기준일 ${M.iso(S.ref)}</span>`
    + `<span>파일: Ledger ${esc(S.ledger?.name || '–')} · 체크리스트 ${esc(S.check?.name || '–')}</span><span>인쇄 ${ts}</span>`
    + (isSample() ? '<span class="sb">샘플 데이터 — 실제 값 아님</span>' : '')
    + (S.tab === 'prod' && S.ledger ? (() => { const t = insights()[0]; return t ? `<span>알림(${esc(t.tag)}): ${esc(t.text)}</span>` : ''; })() : '');
}
window.addEventListener('beforeprint', printHeader);
$('#btnPrint').onclick = () => { printHeader(); window.print(); };
$('#btnExport').onclick = () => {
  const tables = [...document.querySelectorAll('#app [role=tabpanel] table')];
  if (!tables.length) { alert('내보낼 표가 없습니다. 먼저 워크북을 불러오세요.'); return; }
  const wb = XLSX.utils.book_new(), used = new Set();
  tables.forEach((t, k) => {
    let n = (t.dataset.sheet || 'Sheet' + (k + 1)).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 28) || 'Sheet';
    let u = n, i = 2; while (used.has(u)) u = n.slice(0, 26) + ' ' + i++; used.add(u);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.table_to_sheet(t, { display: true, raw: false }), u);
  });
  XLSX.writeFile(wb, `barossa_${S.tab}_${M.iso(S.ref)}.xlsx`);
};
// 타임라인 폭은 화면 폭을 따름 → 크기 바뀌면 다시 그림
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S.tab !== 'prod') render(); }, 200); });
render();
</script>
