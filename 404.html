<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 — 클로드 완전정복</title>
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{--page:#FAF9F5;--ink:#1F1E1A;--ink-soft:#5C5749;--clay:#D97757;--line:#CFC7B4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:'Galmuri11',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
img{width:120px;image-rendering:pixelated;margin-bottom:16px}
h1{font-size:22px;margin-bottom:10px}
p{color:var(--ink-soft);font-size:14px;line-height:1.8;margin-bottom:20px}
a{display:inline-block;padding:10px 22px;background:var(--clay);color:#fff;text-decoration:none;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:inherit;font-size:14px}
a:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
</style>
</head>
<body>
<div>
  <img src="/assets/claude-master/pet/pet-stage-1.png" alt="길 잃은 공룡">
  <h1>404 — 길을 잃었어요</h1>
  <p>공룡이 열심히 찾아봤지만 이 페이지는 숲속에 없네요.<br>홈으로 돌아가 학습을 계속해 볼까요?</p>
  <a href="/">홈으로 돌아가기</a>
</div>
</body>
</html>
